// ---------------------------------------------------------------- vehicles (drawn facing +x, mirrored for leftbound lanes)
const OUTLINE = '#15131f';

function drawWheels(L, hw, xs) {
  ctx.fillStyle = '#121418';
  const ww = T * 0.24, wt = T * 0.09;
  for (const fx of xs) {
    const x = fx * L - ww / 2;
    fr(x, -hw - wt * 0.5, ww, wt);
    fr(x, hw - wt * 0.5, ww, wt);
  }
}

function drawLights(L, Wd, cy) {
  const hl = L / 2;
  ctx.fillStyle = '#fff4c4';
  fr(hl - T * 0.08, cy - Wd * 0.32, T * 0.06, Wd * 0.16);
  fr(hl - T * 0.08, cy + Wd * 0.16, T * 0.06, Wd * 0.16);
  ctx.fillStyle = '#e0202f';
  fr(-hl + T * 0.03, cy - Wd * 0.32, T * 0.05, Wd * 0.15);
  fr(-hl + T * 0.03, cy + Wd * 0.17, T * 0.05, Wd * 0.15);
}

function drawCar(v) {
  const L = v.len * T, Wd = T * 0.64, hl = L / 2, hw = Wd / 2, sh = CAR_SHAPES[v.style], q = 1 / RS;
  const cy = -Wd * 0.06; // center of the top face (the body has a darker lower lip)
  fillRR(-hl + 2 * q, -hw + 3 * q, L, Wd, Wd * 0.3, 'rgba(0,0,0,0.3)');
  drawWheels(L, hw, [-0.3, 0.28]);
  fillRR(-hl - q, -hw - q, L + 2 * q, Wd + 2 * q, Wd * 0.3, OUTLINE);
  fillRR(-hl, -hw, L, Wd, Wd * 0.3, v.dark);
  fillRR(-hl, -hw, L, Wd * 0.86, Wd * 0.3, v.color);
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  fr(-hl + 3 * q, -hw + q, L - 6 * q, q);
  if (sh.bed) fillRR(sh.bed[0] * L, cy - Wd * 0.3, (sh.bed[1] - sh.bed[0]) * L, Wd * 0.6, Wd * 0.06, v.dark);
  fillRR(sh.rw[0] * L, cy - Wd * 0.37, (sh.ws[1] - sh.rw[0]) * L, Wd * 0.74, Wd * 0.16, '#1c2733');
  fillRR(sh.roof[0] * L, cy - Wd * 0.31, (sh.roof[1] - sh.roof[0]) * L, Wd * 0.62, Wd * 0.12, v.light);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  fr(sh.roof[1] * L + q, cy - Wd * 0.28, q, Wd * 0.26);
  ctx.fillStyle = v.dark;
  fr(sh.ws[0] * L, -hw - 2 * q, L * 0.05, 2 * q);
  fr(sh.ws[0] * L, hw, L * 0.05, 2 * q);
  drawLights(L, Wd, cy);
}

function drawBus(v) {
  const L = v.len * T, Wd = T * 0.8, hl = L / 2, hw = Wd / 2, cy = -Wd * 0.06, q = 1 / RS;
  fillRR(-hl + 2 * q, -hw + 3 * q, L, Wd, T * 0.12, 'rgba(0,0,0,0.3)');
  drawWheels(L, hw, [-0.3, 0.3]);
  fillRR(-hl - q, -hw - q, L + 2 * q, Wd + 2 * q, T * 0.12, OUTLINE);
  fillRR(-hl, -hw, L, Wd, T * 0.12, v.stripeDark);
  fillRR(-hl, -hw, L, Wd * 0.88, T * 0.12, '#f1eee5');
  ctx.fillStyle = v.stripe;
  fr(-hl + T * 0.06, -hw + Wd * 0.05, L - T * 0.12, Wd * 0.09);
  fr(-hl + T * 0.06, hw - Wd * 0.22, L - T * 0.12, Wd * 0.09);
  fillRR(-hl + L * 0.08, cy - Wd * 0.22, L * 0.78, Wd * 0.44, T * 0.05, '#e2ded3');
  for (const ax of [0.18, 0.55]) {
    const x = -hl + L * ax;
    fillRR(x, cy - Wd * 0.17, L * 0.16, Wd * 0.34, T * 0.03, '#b9bcc0');
    ctx.fillStyle = '#8f9398';
    for (let i = 1; i < 4; i++) fr(x + L * 0.04 * i, cy - Wd * 0.13, q, Wd * 0.26);
  }
  fillRR(hl - L * 0.06, cy - Wd * 0.36, L * 0.045, Wd * 0.72, T * 0.03, '#1c2733');
  ctx.fillStyle = '#9a9a92';
  for (let i = 0; i < 3; i++) fr(-hl + T * 0.06 + i * 2 * q, cy - Wd * 0.2, q, Wd * 0.4);
  ctx.fillStyle = '#2a2a2a';
  fr(hl - L * 0.05, -hw - 2 * q, T * 0.05, 3 * q);
  fr(hl - L * 0.05, hw - q, T * 0.05, 3 * q);
  drawLights(L, Wd, cy);
}

function drawCop(v) {
  const L = v.len * T, Wd = T * 0.64, hl = L / 2, hw = Wd / 2, cy = -Wd * 0.06, q = 1 / RS;
  fillRR(-hl + 2 * q, -hw + 3 * q, L, Wd, Wd * 0.3, 'rgba(0,0,0,0.3)');
  drawWheels(L, hw, [-0.3, 0.28]);
  fillRR(-hl - q, -hw - q, L + 2 * q, Wd + 2 * q, Wd * 0.3, OUTLINE);
  fillRR(-hl, -hw, L, Wd, Wd * 0.3, '#0c0e12');
  fillRR(-hl, -hw, L, Wd * 0.86, Wd * 0.3, '#1d222a');
  ctx.fillStyle = '#f4f4f2'; fr(-L * 0.24, -hw, L * 0.44, Wd * 0.86);
  ctx.fillStyle = '#b5b5b0'; fr(-L * 0.24, -hw + Wd * 0.86, L * 0.44, Wd * 0.14);
  fillRR(-L * 0.3, cy - Wd * 0.37, L * 0.52, Wd * 0.74, Wd * 0.16, '#1c2733');
  fillRR(-L * 0.2, cy - Wd * 0.31, L * 0.3, Wd * 0.62, Wd * 0.12, '#ffffff');
  // light bar: red and blue halves trade off, with a stepped pixel glow
  const on = Math.floor(time * 7 + v.phase) % 2 === 0;
  const bx = -L * 0.07, bw = L * 0.11, by = cy - Wd * 0.36, bh = Wd * 0.72;
  fillRR(bx - q, by - q, bw + 2 * q, bh + 2 * q, 0, OUTLINE);
  fillRR(bx, by, bw, bh / 2, 0, on ? '#ff2d3d' : '#6b1820');
  fillRR(bx, by + bh / 2, bw, bh / 2, 0, on ? '#1c2f6e' : '#3d7bff');
  ctx.globalCompositeOperation = 'lighter';
  const gx = bx + bw / 2, gy = on ? by + bh * 0.25 : by + bh * 0.75, col = on ? 'rgba(255,40,60,' : 'rgba(50,110,255,';
  circle(gx, gy, T * 0.95, col + '0.16)');
  circle(gx, gy, T * 0.62, col + '0.2)');
  circle(gx, gy, T * 0.32, col + '0.3)');
  ctx.globalCompositeOperation = 'source-over';
  drawLights(L, Wd, cy);
}

// ---------------------------------------------------------------- player (drawn facing up, rotated to face direction)
function drawStudent(u) {
  const q = 1 / RS;
  // dark outline pass so the little sprite pops off the pavement
  ellipse(-u * 0.1, -u * 0.13, u * 0.055 + q, u * 0.075 + q, OUTLINE);
  ellipse(u * 0.1, -u * 0.13, u * 0.055 + q, u * 0.075 + q, OUTLINE);
  circle(-u * 0.25, 0, u * 0.07 + q, OUTLINE);
  circle(u * 0.25, 0, u * 0.07 + q, OUTLINE);
  ellipse(0, 0, u * 0.25 + q, u * 0.15 + q, OUTLINE);
  fillRR(-u * 0.19 - q, u * 0.02 - q, u * 0.38 + 2 * q, u * 0.26 + 2 * q, u * 0.08, OUTLINE);
  circle(0, -u * 0.04, u * 0.12 + q, OUTLINE);
  fillRR(-u * 0.09 - q, -u * 0.18 - q, u * 0.18 + 2 * q, u * 0.08 + 2 * q, 0, OUTLINE);

  ellipse(-u * 0.1, -u * 0.13, u * 0.055, u * 0.075, '#2d2f38');   // sneakers peeking out front
  ellipse(u * 0.1, -u * 0.13, u * 0.055, u * 0.075, '#2d2f38');
  circle(-u * 0.25, 0, u * 0.07, '#2f6fb0');                          // arms
  circle(u * 0.25, 0, u * 0.07, '#2f6fb0');
  circle(-u * 0.27, -u * 0.06, u * 0.045, '#c98d63');                 // hands
  circle(u * 0.27, -u * 0.06, u * 0.045, '#c98d63');
  ellipse(0, 0, u * 0.25, u * 0.15, '#3577bd');                       // hoodie
  fillRR(-u * 0.19, u * 0.02, u * 0.38, u * 0.26, u * 0.08, '#f08a24'); // backpack
  fillRR(-u * 0.19, u * 0.02, u * 0.38, u * 0.09, u * 0.05, '#c96a12');
  fillRR(-u * 0.11, u * 0.16, u * 0.22, u * 0.09, u * 0.035, '#d9781c');
  ctx.fillStyle = '#7a3f0b';                                          // straps
  fr(-u * 0.15, -u * 0.1, q, u * 0.13);
  fr(u * 0.13, -u * 0.1, q, u * 0.13);
  circle(0, -u * 0.04, u * 0.12, '#c98d63');                          // head
  circle(0, -u * 0.02, u * 0.11, '#1b998b');                          // cap
  fillRR(-u * 0.09, -u * 0.18, u * 0.18, u * 0.08, 0, '#137a6d');     // brim points forward
  ctx.fillStyle = '#4fd1c0';
  fr(-u * 0.05, -u * 0.08, q, q);                                     // cap shine
}

function drawPlayer() {
  const u = T * 1.2, q = 1 / RS;
  if (!player.alive) {
    const cx = snap(sx(player.deadX)), cy = snap(sy(player.deadY));
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1.35, 0.45);
    ctx.rotate(player.deadRot);
    drawStudent(u);
    ctx.restore();
    if (deathT < 0.35) {
      const k = deathT / 0.35;
      ring(cx, cy, T * (0.3 + 0.9 * k), Math.max(1, Math.round(TN * 0.12 * (1 - k))), 'rgba(255,255,255,' + (1 - k).toFixed(2) + ')');
    }
    return;
  }
  const e = easeOut(player.t);
  let x = lerp(player.fromCol, player.col, e) + 0.5;
  let y = lerp(player.fromRow, player.row, e) + 0.5;
  const jump = Math.sin(Math.PI * player.t);
  if (player.bump > 0) {
    const a = FACE_ANGLE[player.bumpFace], b = Math.sin(player.bump * Math.PI) * 0.1;
    x += Math.sin(a) * b;
    y += Math.cos(a) * b;
  }
  const cx = snap(sx(x)), cy = snap(sy(y)), k = 1 - jump * 0.35;
  ellipse(cx, cy + u * 0.12, u * 0.27 * k, u * 0.14 * k, 'rgba(0,0,0,0.3)');
  const bob = player.t >= 1 && Math.floor(time * 2.5) % 2 ? q : 0;  // two-frame idle bob
  ctx.save();
  ctx.translate(cx, snap(cy - jump * u * 0.3) - bob);
  ctx.rotate(FACE_ANGLE[player.face]);
  drawStudent(u);
  ctx.restore();
}

function drawParticles() {
  const q = 1 / RS;
  for (const p of particles) {
    const a = 1 - p.t / p.life, w = T * p.w, ph = Math.max(2 * q, snap(w * 1.3));
    const pw = Math.max(q, snap(w * Math.abs(Math.cos(p.rot))));   // paper flips edge-on as it tumbles
    const x = snap(sx(p.x) - pw / 2), y = snap(sy(p.y) - ph / 2);
    ctx.globalAlpha = Math.min(1, a * 1.5);
    ctx.fillStyle = p.c;
    fr(x, y, pw, ph);
    if (pw > 2 * q) {
      ctx.fillStyle = '#8aa0c8';
      for (let j = 2 * q; j < ph - q; j += 2 * q) fr(x + q, y + j, pw - 2 * q, q);
    }
    ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------- world to screen
// World x counts columns from the west, world y counts rows up from Broad St. The camera position is
// rounded to whole art pixels so the pre-painted map and everything drawn over it stay on one grid.
let camXpx = 0, camYpx = 0, shX = 0, shY = 0;
const sx = x => (x * TN - camXpx) / RS;
const sy = y => (lo.height - y * TN + camYpx) / RS;
const sc = () => Math.max(1, Math.round(TN / 16));     // art px per "sprite px" for the small props
const visLaps = () => [Math.max(0, lapOf(drawCY - 1)), lapOf(drawCY + rowsVis + 1)];

function blitMap(cv, L) {                               // one lap canvas, or the campus when L is -1
  const top = L < 0 ? lo.height + camYpx : lo.height - ((L + 1) * LAP * TN - camYpx);
  ctx.drawImage(cv, shX - camXpx, shY + top);
}

// ---------------------------------------------------------------- sidewalk clutter
function oCone() {
  const n = TN, s = sc(), m = n >> 1, by = n - 3 * s;
  px(m - 4 * s, by + 2 * s, 10 * s, s, 'rgba(0,0,0,0.28)');
  px(m - 5 * s, by, 10 * s, 2 * s, '#a8360c');
  for (let j = 0; j < 9; j++) {
    const w = (1 + j) * s, x = m - Math.floor(w / 2), y = by - (9 - j) * s;
    px(x, y, w, s, j === 4 || j === 5 ? '#f4f1ea' : '#f26b1d');
    if (j > 1) px(x + w - s, y, s, s, j === 4 || j === 5 ? '#cfc9bb' : '#c8501a');
  }
}

function oBarrier() {
  const n = TN, s = sc(), y0 = n - 10 * s;
  px(2 * s, n - 2 * s, n - 3 * s, s, 'rgba(0,0,0,0.25)');
  ctx.fillStyle = '#d9d4c7';
  px(3 * s, y0 + 3 * s, s, 7 * s); px(n - 4 * s, y0 + 3 * s, s, 7 * s);
  px(2 * s, n - 3 * s, 3 * s, s); px(n - 5 * s, n - 3 * s, 3 * s, s);
  px(s, y0, n - 2 * s, 4 * s, '#f4f1ea');
  ctx.fillStyle = '#e8551c';
  for (let j = 0; j < 4; j++) for (let i = -8 * s + j * s; i < n; i += 5 * s) {   // diagonal stripes
    const a = Math.max(s, i), b = Math.min(n - s, i + 2 * s);
    if (b > a) px(a, y0 + j * s, b - a, s);
  }
  px(s, y0 + 4 * s, n - 2 * s, s, '#8f8b80');
  px((n >> 1) - s, y0 - 2 * s, 2 * s, 2 * s, Math.floor(time * 2.5) % 2 ? '#8a6a1a' : '#ffcf3f');   // blinker
}

function oPlanter(c, r) {
  const n = TN, s = sc(), m = n >> 1, q = s / RS;
  px(3 * s, n - 2 * s, n - 5 * s, s, 'rgba(0,0,0,0.25)');
  px(4 * s, n - 7 * s, n - 8 * s, 5 * s, '#a3543e');
  px(n - 5 * s, n - 7 * s, s, 5 * s, '#7f3a2b');
  px(3 * s, n - 8 * s, n - 6 * s, 2 * s, '#c06a4e');
  const cx = ox + m / RS, cy = oy + (n - 12 * s) / RS;
  circle(cx, cy, 5 * q, '#2a6b33');
  circle(cx - q, cy - q, 4 * q, '#3e9a47');
  circle(cx - 2 * q, cy - 2 * q, 2 * q, '#5cb85c');
  for (let k = 0; k < 4; k++) px(m - 4 * s + Math.floor(hash(c, r, 40 + k) * 8) * s, n - 16 * s + Math.floor(hash(c, r, 50 + k) * 7) * s, s, s, k & 1 ? '#ff6b8a' : '#ffd23f');
}

function oScooter(c, r) {                               // a rental scooter left on its kickstand
  const n = TN, s = sc(), col = hash(c, r, 5) < 0.5 ? '#2bb673' : '#f2c230';
  px(2 * s, n - 2 * s, n - 4 * s, s, 'rgba(0,0,0,0.25)');
  px(5 * s, n - 3 * s, s, 2 * s, '#3a3d46');
  px(2 * s, n - 5 * s, 3 * s, 3 * s, '#15131f'); px(n - 5 * s, n - 5 * s, 3 * s, 3 * s, '#15131f');
  px(3 * s, n - 4 * s, s, s, '#8a8f98'); px(n - 4 * s, n - 4 * s, s, s, '#8a8f98');
  px(4 * s, n - 6 * s, n - 8 * s, 2 * s, col);
  px(n - 5 * s, n - 15 * s, 2 * s, 10 * s, '#3a3d46');
  px(n - 7 * s, n - 15 * s, 6 * s, s, '#15131f');
  px(n - 5 * s, n - 12 * s, 2 * s, s, col);
  px(n - 3 * s, n - 11 * s, s, s, '#fff4c4');
}

function oPatio(c, r) {                                 // a cafe table with an umbrella
  const n = TN, s = sc(), m = n >> 1, aw = AWNINGS[Math.floor(hash(c, r, 9) * AWNINGS.length)];
  px(s, n - 2 * s, n - 2 * s, s, 'rgba(0,0,0,0.22)');
  ctx.fillStyle = '#2a2d33';
  px(s, n - 8 * s, 2 * s, 6 * s); px(s, n - 4 * s, 4 * s, s);
  px(n - 3 * s, n - 8 * s, 2 * s, 6 * s); px(n - 5 * s, n - 4 * s, 4 * s, s);
  px(m - s, n - 15 * s, s, 12 * s, '#cfc9bb');
  px(m - 4 * s, n - 7 * s, 8 * s, 2 * s, '#ece7da');
  px(m - 4 * s, n - 5 * s, 8 * s, s, '#b9b3a6');
  const rows = [5, 9, 12, 14], y0 = n - 18 * s;
  rows.forEach((w, j) => {
    const a = m - Math.ceil(w / 2) * s, b = a + w * s, y = y0 + j * s;
    px(a, y, b - a, s, aw[0]);
    for (let k = -6; k <= 6; k += 4) {
      const p = Math.max(a, m + k * s), e = Math.min(b, m + (k + 2) * s);
      if (e > p) px(p, y, e - p, s, aw[1]);
    }
  });
  for (let i = m - 7 * s; i < m + 7 * s; i += 2 * s) px(i, y0 + 4 * s, s, s, aw[0]);   // scalloped hem
}

const OBST_DRAW = {
  cone: oCone, barrier: oBarrier, planter: oPlanter, scooter: oScooter, patio: oPatio,
  bench: () => drawBench(ox + T / 2, oy + T * 0.62),
};
function drawObstacles(x0, x1, y0, y1) {
  const list = [];
  for (const [k, t] of obst) {
    const r = Math.floor(k / 64), c = k - r * 64;
    if (c >= x0 - 1 && c <= x1 && r >= y0 - 1 && r <= y1) list.push([c, r, t]);
  }
  list.sort((a, b) => b[1] - a[1]);                     // north first, so nearer props overlap farther ones
  for (const [c, r, t] of list) { ox = sx(c); oy = sy(r + 1); OBST_DRAW[t](c, r); }
}

// ---------------------------------------------------------------- traffic
function drawVehicles(x0, x1, y0, y1) {
  const out = [];
  const one = (car, ln) => {
    const p = carPose(car, ln);
    if (p.x < x0 || p.x > x1 || p.y < y0 || p.y > y1) return;
    const X = snap(sx(p.x)), Yp = snap(sy(p.y));
    ctx.save();
    ctx.translate(X, Yp);
    ctx.rotate(p.a);
    if (Math.cos(p.a) < -0.01) ctx.scale(1, -1);       // westbound: keep the sprite's lit side up
    if (car.kind === 'bus') drawBus(car); else if (car.kind === 'cop') drawCop(car); else drawCar(car);
    ctx.restore();
    out.push({ X, Y: Yp, a: p.a, car });
  };
  for (const ln of hLanes.values()) if (ln.row >= y0 - 1 && ln.row <= y1) for (const car of ln.cars) one(car, ln);
  for (const ln of vLanes) if (ln.c >= x0 - 1 && ln.c <= x1) for (const car of ln.cars) one(car, ln);
  for (const ln of colLanes.values()) for (const car of ln.cars) one(car, ln);
  return out;
}

// ---------------------------------------------------------------- the gameday crowd
// Seen from behind as they surge north: shirts in red, black and white, caps, arms up, shakers and flags.
// No logos or lettering anywhere, just colors.
const FAN_SHIRT = ['#c41e3a', '#c41e3a', '#c41e3a', '#9e1530', '#1c1b20', '#1c1b20', '#f1efe8', '#7d828c'];
const FAN_SKIN = ['#f1c7a0', '#e0ac7e', '#c68b5e', '#9a6440', '#6b4129'];
const FAN_HAIR = ['#2a1d14', '#4a3020', '#141414', '#b8873c', '#6b3a1e'];

function fan(cx, cy, h, h2, front) {
  const u = T, q = 1 / RS;
  const shirt = FAN_SHIRT[Math.floor(h * 97) % FAN_SHIRT.length], skin = FAN_SKIN[Math.floor(h2 * 5)];
  ctx.fillStyle = OUTLINE; fr(cx - u * 0.2 - q, cy - u * 0.04 - q, u * 0.4 + 2 * q, u * 0.26 + 2 * q);
  ctx.fillStyle = shirt; fr(cx - u * 0.2, cy - u * 0.04, u * 0.4, u * 0.26);
  if (h2 > 0.8) { ctx.fillStyle = shirt === '#1c1b20' ? '#c41e3a' : '#1c1b20'; fr(cx - u * 0.2, cy + u * 0.06, u * 0.4, u * 0.05); }
  if (front || h2 > 0.55) {                             // arms up, pumping
    const w = Math.sin(time * 10 + h * 30) > 0 ? u * 0.07 : 0;
    ctx.fillStyle = skin;
    fr(cx - u * 0.28, cy - u * 0.3 - w, u * 0.07, u * 0.3);
    fr(cx + u * 0.21, cy - u * 0.37 + w, u * 0.07, u * 0.3);
    if (h > 0.45) {
      const pc = h > 0.72 ? '#f1efe8' : '#c41e3a';
      circle(cx - u * 0.25, cy - u * 0.34 - w, u * 0.1, pc);
      circle(cx + u * 0.25, cy - u * 0.41 + w, u * 0.1, pc);
    }
  }
  ctx.fillStyle = skin; fr(cx - u * 0.1, cy - u * 0.2, u * 0.2, u * 0.19);
  if (h2 < 0.32) {                                      // ball cap, worn backwards
    ctx.fillStyle = h2 < 0.18 ? '#c41e3a' : '#1c1b20';
    fr(cx - u * 0.11, cy - u * 0.23, u * 0.22, u * 0.14);
    fr(cx - u * 0.06, cy - u * 0.09, u * 0.12, u * 0.05);
  } else {
    ctx.fillStyle = FAN_HAIR[Math.floor(h * 13) % FAN_HAIR.length];
    fr(cx - u * 0.1, cy - u * 0.22, u * 0.2, u * 0.13);
  }
}

function drawCrowd() {
  if (!creepOn && creepY <= drawCY) return;
  const fy = sy(creepY), bottom = sy(drawCY - 1), u = T, q = 1 / RS;
  if (fy > bottom) return;
  ctx.fillStyle = '#2b0c14';
  fr(-u, snap(fy + u * 0.15), W + 2 * u, bottom - fy);
  const DX = 0.5, DY = 0.4, n = Math.min(24, Math.ceil((creepY - drawCY + 1.2) / DY));
  const i0 = Math.floor((drawCX - 1) / DX), i1 = Math.ceil((drawCX + viewCols + 1) / DX);
  for (let j = n; j >= 0; j--) {
    const wy = creepY - 0.18 - j * DY;
    for (let i = i0; i <= i1; i++) {
      const h = hash(i, j, 701);
      if (j > 0 && h < 0.05) continue;
      const wx = (i + (j & 1) * 0.5) * DX + (hash(i, j, 702) - 0.5) * 0.16;
      const hop = Math.sin(time * 8 + h * 40) > 0.55 ? u * 0.06 : 0;
      fan(snap(sx(wx)), snap(sy(wy) - hop), h, hash(i, j, 703), j < 2);
    }
    if (j === 2) for (let i = i0; i <= i1; i++) {        // flags on poles, waving
      if (i % 7 || hash(i, 9, 704) > 0.7) continue;
      const fx = snap(sx(i * DX)), top = snap(sy(wy) - u * 1.15), red = hash(i, 8, 704) < 0.6;
      ctx.fillStyle = '#d8d4c8'; fr(fx, top, Math.max(q, u * 0.05), u * 1.1);
      for (let k = 0; k < 6; k++) {
        const x = fx + q + k * u * 0.1, y = snap(top + Math.sin(time * 7 + k * 0.9 + i) * u * 0.05);
        ctx.fillStyle = red ? '#c41e3a' : '#1c1b20'; fr(x, y, u * 0.1, u * 0.36);
        ctx.fillStyle = red ? '#1c1b20' : '#f1efe8'; fr(x, y + u * 0.13, u * 0.1, u * 0.08);
      }
    }
  }
  const CONF = ['#c41e3a', '#f1efe8', '#1c1b20', '#ffd23f'];
  for (let k = 0; k < 16; k++) {                       // confetti blowing out ahead of them
    const t0 = time * 0.7 + hash(k, 3, 705), t = t0 % 1, g = Math.floor(t0);
    const wx = drawCX + hash(k, g, 706) * viewCols + Math.sin(time * 3 + k) * 0.2, wy = creepY - 0.1 + t * 1.5;
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = CONF[k & 3];
    fr(snap(sx(wx)), snap(sy(wy)), 2 * q, (k & 1 ? 1 : 2) * q);
  }
  ctx.globalAlpha = 1;
}

function drawCrowdWarning() {                           // the screen edge flashes red when they're close
  if (state !== 'play' || !creepOn) return;
  const py = lerp(player.fromRow, player.row, easeOut(player.t)) + 0.5, d = py - creepY;
  if (d > 3) return;
  const k = clamp(1 - (d - 0.6) / 2.4, 0, 1);
  if (Math.floor(time * (4 + 6 * k)) % 2) return;
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  const th = T * 0.22;
  for (let b = 0; b < 3; b++) {
    ctx.fillStyle = 'rgba(255,40,60,' + ((0.16 + 0.3 * k) / (b + 1)).toFixed(3) + ')';
    fr(0, H - th * (b + 1), W, th);
    fr(0, H * 0.45 + b * th, th * (3 - b), H);
    fr(W - th * (3 - b), H * 0.45 + b * th, th * (3 - b), H);
  }
}

// ---------------------------------------------------------------- time of day: each lap of downtown is later in the day
const SKY = [[0.5, 255, 190, 120, 0], [1.25, 255, 150, 80, 0.24], [2.1, 130, 90, 180, 0.42], [2.9, 46, 54, 130, 0.6]];
function skyNow(f) {
  if (f <= SKY[0][0]) return SKY[0];
  for (let i = 1; i < SKY.length; i++) if (f <= SKY[i][0]) {
    const a = SKY[i - 1], b = SKY[i], k = (f - a[0]) / (b[0] - a[0]);
    return a.map((v, j) => lerp(v, b[j], k));
  }
  return SKY[SKY.length - 1];
}

function drawSky(cars) {
  const f = Math.max(0, maxRow) / LAP, s = skyNow(f), nf = clamp((f - 1.7) / 1.1, 0, 1);
  if (s[4] < 0.01 && nf < 0.01) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = 'rgba(' + (s[1] | 0) + ',' + (s[2] | 0) + ',' + (s[3] | 0) + ',' + s[4].toFixed(3) + ')';
  ctx.fillRect(0, 0, lo.width, lo.height);
  if (nf > 0.01) {                                      // street lamps, neon and headlights come up after dark
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = nf * 0.85;
    const [L0, L1] = visLaps();
    for (let L = L0; L <= L1; L++) blitMap(lightCv, L);
    ctx.globalAlpha = 1;
    ctx.setTransform(RS, 0, 0, RS, shX, shY);
    const al = (0.2 * nf).toFixed(3);
    for (const v of cars) {
      const d = v.car.len * T / 2 + T * 0.45, hx = v.X + Math.cos(v.a) * d, hy = v.Y + Math.sin(v.a) * d;
      circle(hx, hy, T * 0.42, 'rgba(255,236,170,' + al + ')');
      circle(hx, hy, T * 0.22, 'rgba(255,236,170,' + al + ')');
      if (v.car.kind === 'cop') circle(v.X, v.Y, T * 1.1, Math.floor(time * 7 + v.car.phase) % 2 ? 'rgba(60,110,255,' + al + ')' : 'rgba(255,40,60,' + al + ')');
    }
    if (player.alive) {
      const e = easeOut(player.t);
      circle(snap(sx(lerp(player.fromCol, player.col, e) + 0.5)), snap(sy(lerp(player.fromRow, player.row, e) + 0.5)), T * 0.8, 'rgba(255,230,190,' + (0.14 * nf).toFixed(3) + ')');
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- frame
function draw() {
  camXpx = Math.round(drawCX * TN);
  camYpx = Math.round(drawCY * TN);
  shX = shY = 0;
  if (shake > 0) { const m = shake * 20 * RS; shX = Math.round((Math.random() - 0.5) * m); shY = Math.round((Math.random() - 0.5) * m); }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#2a2630';
  ctx.fillRect(0, 0, lo.width, lo.height);
  const [L0, L1] = visLaps(), campus = drawCY < 0.5;
  if (campus) blitMap(campusCv, -1);
  for (let L = L0; L <= L1; L++) blitMap(lapCv, L);

  ctx.setTransform(RS, 0, 0, RS, shX, shY);
  const x0 = drawCX - 1, x1 = drawCX + viewCols + 1, y0 = drawCY - 1, y1 = drawCY + rowsVis + 1;
  for (let L = L0; L <= L1; L++) for (const e of LIVE) {   // animated signs over the painted map
    const top = L * LAP + e.r + 1;
    if (top < y0 || top - 4 > y1 || e.c + e.w < x0 || e.c > x1) continue;
    ox = sx(e.c); oy = sy(top); e.draw();
  }
  if (campus) for (const e of CLIVE) { if (e.r + 1 >= y0 && e.c <= x1 && e.c + 2 >= x0) { ox = sx(e.c); oy = sy(e.r + 1); e.draw(); } }
  drawObstacles(x0, x1, y0, y1);
  if (!player.alive) drawPlayer();                      // flattened student goes under the traffic
  const cars = drawVehicles(x0 - 2, x1 + 2, y0 - 2, y1 + 2);
  drawParticles();
  if (player.alive) drawPlayer();
  drawCrowd();
  drawSky(cars);
  drawCrowdWarning();

  // present: blow the art buffer up to the screen with hard edges, then lay faint scanlines over it
  mainCtx.setTransform(1, 0, 0, 1, 0, 0);
  mainCtx.imageSmoothingEnabled = false;
  mainCtx.drawImage(lo, 0, 0, lo.width * P, lo.height * P);
  if (scanPat) {
    mainCtx.fillStyle = scanPat;
    mainCtx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- input: touch / mouse
const gestures = new Map();
const swipeThreshold = () => Math.max(16, Math.min(W, H) * 0.045);

function swipe(dx, dy) {
  if (Math.abs(dx) > Math.abs(dy)) requestMove(dx > 0 ? 1 : -1, 0);
  else requestMove(0, dy > 0 ? -1 : 1);
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  gestures.set(e.pointerId, { x: e.clientX, y: e.clientY, done: false });
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not critical */ }
});
canvas.addEventListener('pointermove', e => {
  const g = gestures.get(e.pointerId);
  if (!g || g.done) return;
  const dx = e.clientX - g.x, dy = e.clientY - g.y;
  if (Math.hypot(dx, dy) >= swipeThreshold()) { g.done = true; swipe(dx, dy); }
});
canvas.addEventListener('pointerup', e => {
  const g = gestures.get(e.pointerId);
  if (!g) return;
  gestures.delete(e.pointerId);
  if (g.done) return;
  const dx = e.clientX - g.x, dy = e.clientY - g.y;
  if (Math.hypot(dx, dy) >= swipeThreshold()) swipe(dx, dy);
  else requestMove(0, 1);
});
canvas.addEventListener('pointercancel', e => gestures.delete(e.pointerId));

// keep the page from scrolling, zooming, or popping menus
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------------------------------------------------------------- input: keyboard
const KEYS = {
  ArrowUp: [0, 1], KeyW: [0, 1], ArrowDown: [0, -1], KeyS: [0, -1],
  ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
};
window.addEventListener('keydown', e => {
  if (state === 'menu' || state === 'over') {
    if ((e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter') && !e.repeat) {
      e.preventDefault();
      startGame();
    }
    return;
  }
  const mv = KEYS[e.code];
  if (mv) { e.preventDefault(); if (!e.repeat) requestMove(mv[0], mv[1]); }
  else if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) requestMove(0, 1); }
});

playBtn.addEventListener('click', startGame);
againBtn.addEventListener('click', startGame);

// ---------------------------------------------------------------- pixel font for the HUD and menus
// 5x7 glyphs, one base-32 digit per row (leftmost pixel is the high bit). Text is painted into a small
// canvas at a whole number of device pixels per font pixel, and the real text sits beside it for screen readers.
const FONT = {};
('A ehhhvhh|B uhhuhhu|C ehggghe|D sihhhis|E vgguggv|F vgguggg|G ehgnhhf|H hhhvhhh|I e44444e|J 72222ic|' +
 'K hikokih|L ggggggv|M hrllhhh|N hhpljhh|O ehhhhhe|P uhhuggg|Q ehhhlid|R uhhukih|S fgge11u|T v444444|' +
 'U hhhhhhe|V hhhhha4|W hhhllla|X hha4ahh|Y hha4444|Z v1248gv|0 ehhhhhe|1 4c4444e|2 eh1248v|3 v2421he|' +
 '4 26aiv22|5 vgu11he|6 68guhhe|7 v124888|8 ehhehhe|9 ehhf12c|  0000000|! 4444404|. 00000cc|, 0000c48|' +
 "' 4480000|- 000e000|? eh12404|: 0cc0cc0|/ 11248gg").split('|').forEach(p => {
  FONT[p[0]] = p.slice(2).split('').map(d => parseInt(d, 32));
});

const pxEls = new Set();
const cardIn = () => Math.min(340, innerWidth - 32) - 44;   // text width inside a menu card

function pxWrap(words, cpl) {
  const lines = [];
  let cur = '';
  for (let w of words) {
    while (w.length > cpl) { if (cur) { lines.push(cur); cur = ''; } lines.push(w.slice(0, cpl)); w = w.slice(cpl); }
    if (!cur) cur = w;
    else if (cur.length + 1 + w.length <= cpl) cur += ' ' + w;
    else { lines.push(cur); cur = w; }
  }
  if (cur || !lines.length) lines.push(cur);
  return lines;
}

function pxRender(el) {
  const o = el._pxo, text = el._pxt, dpr = Math.min(window.devicePixelRatio || 1, 3);
  const maxW = Math.max(30, o.max ? o.max() : 1e4), color = getComputedStyle(el).color;
  const key = text + '|' + dpr + '|' + Math.round(maxW) + '|' + color;
  if (el._pxk === key && el._pxc && el._pxc.parentNode === el) return;
  el._pxk = key;
  if (!el._pxc || el._pxc.parentNode !== el) {
    el.textContent = '';
    el._pxc = document.createElement('canvas');
    el._pxc.className = 'px';
    el._pxc.setAttribute('aria-hidden', 'true');
    el._pxs = document.createElement('span');
    el._pxs.className = 'sr';
    el.append(el._pxc, el._pxs);
  }
  el._pxs.textContent = text;
  const cv = el._pxc, sh = o.shadow ? 1 : 0;
  const words = text.toUpperCase().split(/\s+/).filter(Boolean);
  if (!words.length) { cv.style.display = 'none'; return; }
  cv.style.display = '';
  // biggest scale that fits; wrapping text keeps its size and breaks into lines instead
  const fits = (lines, s) => lines.every(l => (l.length * 6 - 1 + sh) * s <= maxW);
  let s = o.s, lines;
  for (;;) {
    const cpl = Math.max(1, Math.floor((maxW / s + 1 - sh) / 6));
    lines = o.wrap ? pxWrap(words, cpl) : [words.join(' ')];
    if (fits(lines, s)) break;
    if (s <= o.min) { lines = pxWrap(words, cpl); break; }
    s--;
  }
  const k = Math.max(1, Math.round(s * dpr));
  const wF = Math.max(...lines.map(l => l.length * 6 - 1)) + sh, hF = lines.length * 10 - 3 + sh;
  cv.width = wF * k;
  cv.height = hF * k;
  cv.style.width = cv.width / dpr + 'px';
  cv.style.height = cv.height / dpr + 'px';
  const g = cv.getContext('2d');
  const paint = (d, col) => {
    g.fillStyle = col;
    lines.forEach((l, li) => {
      const lx = Math.floor((wF - sh - (l.length * 6 - 1)) / 2);
      for (let i = 0; i < l.length; i++) {
        const gl = FONT[l[i]] || FONT['?'];
        for (let r = 0; r < 7; r++) {
          const bits = gl[r];
          if (!bits) continue;
          for (let b = 0; b < 5; b++) if (bits & (16 >> b)) g.fillRect((lx + i * 6 + b + d) * k, (li * 10 + r + d) * k, k, k);
        }
      }
    });
  };
  if (sh) paint(1, o.shadow);
  paint(0, color);
}

// o: { s: font px size in CSS px, min: smallest size allowed, max: () => available width, wrap, shadow }
function pxText(el, text, o) {
  if (o) el._pxo = o;
  el._pxt = String(text);
  pxEls.add(el);
  pxRender(el);
}

function refreshPxText() { for (const el of pxEls) pxRender(el); }

const PX = {
  title: { s: 5, min: 3, max: cardIn },
  title2: { s: 7, min: 4, max: cardIn, shadow: '#b8410f' },
  small: { s: 2, min: 1, max: cardIn, wrap: true },
  btn: { s: 4, min: 2, max: () => cardIn() - 32, shadow: '#b8410f' },
  head: { s: 4, min: 2, max: cardIn, wrap: true, shadow: '#8f1d30' },
  statLabel: { s: 2, min: 1, max: () => (cardIn() - 12) / 2 - 18 },
  statNum: { s: 5, min: 2, max: () => (cardIn() - 12) / 2 - 18 },
  badge: { s: 2, min: 1, max: () => cardIn() - 24 },
  score: { s: 6, min: 3, max: () => innerWidth - 32, shadow: '#1d1b2e' },
  hudBest: { s: 2, min: 1, max: () => innerWidth - 32, shadow: '#1d1b2e' },
  toast: { s: 3, min: 2, max: () => Math.min(innerWidth - 40, 360) - 26, wrap: true },
};

// ---------------------------------------------------------------- layout
let artKey = '';
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // about 16 art pixels per tile; wide screens never see more than 36 columns so the blocks stay readable
  const T0 = Math.max(Math.min(W / VIEW_COLS, H / MIN_VIEW_ROWS), W / 36);
  P = Math.max(1, Math.floor(T0 * DPR / 16));
  RS = DPR / P;
  TN = Math.max(4, Math.floor(T0 * RS));
  T = TN / RS;
  lo.width = Math.ceil(canvas.width / P);
  lo.height = Math.ceil(canvas.height / P);
  scanPat = null;
  if (P >= 3) {                       // faint scanlines, one per art pixel row
    const sc = document.createElement('canvas');
    sc.width = 1; sc.height = P;
    const g = sc.getContext('2d');
    g.fillStyle = 'rgba(0,0,0,0.13)';
    const n = Math.max(1, Math.round(P / 4));
    g.fillRect(0, P - n, 1, n);
    scanPat = mainCtx.createPattern(sc, 'repeat');
  }
  rowsVis = H / T;
  viewCols = W / T;
  const key = TN + '|' + RS;
  if (key !== artKey) { artKey = key; buildArt(); }   // the map is painted once per pixel scale
  refreshPxText();
  if (state === 'menu') snapCamera();
}

// ---------------------------------------------------------------- camera
function playerPos() {
  const e = easeOut(player.t);
  return [lerp(player.fromCol, player.col, e) + 0.5, lerp(player.fromRow, player.row, e) + 0.5];
}
function camTarget() {
  const [x, y] = playerPos();
  const ty = Math.max(y - rowsVis * CAM_FRAC, creepY - 1.5, -CAMPUS);   // never lose sight of the crowd
  const tx = viewCols >= WCOLS ? (WCOLS - viewCols) / 2 : clamp(x - viewCols / 2, 0, WCOLS - viewCols);
  return [tx, ty];
}
function snapCamera() {
  [camX, camY] = camTarget();
  drawCX = camX; drawCY = camY;
}
function followCamera(dt) {
  const [tx, ty] = camTarget(), k = Math.min(1, dt * 7);
  camX += (tx - camX) * k;
  camY += (ty - camY) * k;
  drawCX = camX; drawCY = camY;
}

// ---------------------------------------------------------------- storage, HUD, toasts
function loadBest() {
  try { return Math.max(0, parseInt(localStorage.getItem(BEST_KEY), 10) || 0); } catch (e) { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* storage blocked: best lives for this session only */ }
}

const streetEl = document.getElementById('street');
PX.street = { s: 2, min: 1, max: () => innerWidth - 32, shadow: '#1d1b2e' };
PX.fact = { s: 2, min: 1, max: () => Math.min(innerWidth - 40, 360) - 26, wrap: true };

function updateHud() {
  pxText(scoreEl, score(), PX.score);
  pxText(hudBestEl, 'BEST ' + Math.max(best, score()), PX.hudBest);
}
function setStreet(name) {
  if (name === streetName) return;
  streetName = name;
  pxText(streetEl, name, PX.street);
}

const toastQ = [];
let toastUntil = 0;
function showToastNow(msg) {
  const d = Math.min(5.5, 1.8 + msg.length * 0.04);
  pxText(toastEl, msg, msg.length > 34 ? PX.fact : PX.toast);
  toastEl.style.animationDuration = d.toFixed(2) + 's';
  toastEl.classList.remove('show');
  void toastEl.offsetWidth;
  toastEl.classList.add('show');
  toastUntil = time + d;
}
function toast(msg, now) {
  if (now) { toastQ.length = 0; showToastNow(msg); return; }
  if (toastQ.length < 3 && !toastQ.includes(msg)) toastQ.push(msg);
}
function pumpToasts() {
  if (toastQ.length && time >= toastUntil - 0.25) showToastNow(toastQ.shift());
}
function clearToasts() {
  toastQ.length = 0;
  toastUntil = 0;
  toastEl.classList.remove('show');
}

const LAP_LINES = [
  null,
  'Back on Broad St. Downtown again, and the sun is getting low.',
  'Dusk downtown. The bars are lighting up.',
  'Night on Broad St. Gameday never ends.',
];

// ---------------------------------------------------------------- run lifecycle
function resetGame() {
  Object.assign(player, {
    col: START_COL, row: START_ROW, fromCol: START_COL, fromRow: START_ROW, t: 1, face: 0, queued: null, alive: true, bump: 0,
  });
  creepY = -CAMPUS; creepOn = false; maxRow = START_ROW; playT = 0; deathT = 0; shake = 0;
  isNewBest = false; lapShown = 0; archToastAt = -9; particles = [];
  seen.clear();
  clearToasts();
  streetName = '';
  setStreet(placeName(player.col, player.row));
  snapCamera();
  resetTraffic();
  snapCamera();
  freshWorld = true;
  updateHud();
}

function startGame() {
  if (state === 'play' || state === 'dying') return;
  if (state === 'over' && performance.now() - overShownAt < 450) return;   // swallow frantic taps from the run that just ended
  if (!freshWorld) resetGame();
  freshWorld = false;
  state = 'play';
  startEl.classList.add('hidden');
  overEl.classList.add('hidden');
  hudEl.classList.remove('hidden');
  inputLockUntil = performance.now() + 150;
  updateHud();
  toast('Gameday! The crowd is right behind you. Keep moving!', true);
}

function showGameOver() {
  state = 'over';
  clearToasts();
  const line = pick(DEATH_LINES[killer] || DEATH_LINES.car);
  pxText(overTitleEl, line[0], PX.head);
  pxText(overTagEl, line[1] + ' Last seen on ' + streetName + '.', PX.small);
  pxText(finalScoreEl, score(), PX.statNum);
  pxText(finalBestEl, best, PX.statNum);
  newBestEl.classList.toggle('hidden', !isNewBest);
  hudEl.classList.add('hidden');
  overEl.classList.remove('hidden');
  overShownAt = performance.now();
}

function die(kind, x, y) {
  player.alive = false;
  player.queued = null;
  state = 'dying';
  deathT = 0;
  shake = 0.35;
  killer = kind;
  player.deadX = x;
  player.deadY = y;
  player.deadRot = FACE_ANGLE[player.face] + rand(-0.4, 0.4);
  for (let i = 0; i < 14; i++) {      // backpack bursts: homework everywhere
    particles.push({
      x, y, vx: rand(-3.2, 3.2), vy: rand(-3, 3), rot: rand(0, 6.28), vr: rand(-9, 9),
      life: rand(0.9, 1.6), t: 0, w: rand(0.14, 0.22), c: pick(['#ffffff', '#fdf6d8', '#f7e27a', '#cfe8ff']),
    });
  }
  if (kind === 'crowd') for (let i = 0; i < 26; i++) {   // and the crowd throws confetti
    particles.push({
      x: x + rand(-1.5, 1.5), y: y - rand(0, 1), vx: rand(-2, 2), vy: rand(1.5, 5), rot: rand(0, 6.28), vr: rand(-12, 12),
      life: rand(1, 1.8), t: 0, w: rand(0.08, 0.13), c: pick(['#c41e3a', '#c41e3a', '#1c1b20', '#f1efe8']),
    });
  }
  const s = score();
  if (s > best) { best = s; saveBest(best); isNewBest = true; }
  pxText(startBestEl, best > 0 ? 'Best: ' + best : '', PX.small);
}

// ---------------------------------------------------------------- movement
function requestMove(dc, dr) {
  if (state !== 'play' || !player.alive) return;
  if (performance.now() < inputLockUntil) return;
  if (player.t < 1) { player.queued = [dc, dr]; return; }   // buffer one move so fast tapping feels snappy
  doMove(dc, dr);
}

function doMove(dc, dr) {
  const face = dr > 0 ? 0 : dr < 0 ? 2 : dc > 0 ? 1 : 3;
  player.face = face;
  const nc = player.col + dc, nr = player.row + dr;
  if (blocked(nc, nr)) {
    player.bump = 1;
    player.bumpFace = face;
    if (tileKind(nc, nr) === 'arch' && time - archToastAt > 4) {
      archToastAt = time;
      toast('No walking under the Arch until you graduate!', true);
    }
    return;
  }
  player.fromCol = player.col;
  player.fromRow = player.row;
  player.col = nc;
  player.row = nr;
  player.t = 0;
  if (nr > maxRow) maxRow = nr;
  updateHud();
  arrive(nc, nr);
}

function arrive(c, r) {
  setStreet(placeName(c, r));
  const L = r >= 0 ? lapOf(r) : 0;
  if (L > lapShown) {
    lapShown = L;
    toast(LAP_LINES[L] || 'Lap ' + (L + 1) + '. Still going.', true);
  }
  const lr = r < 0 ? r : mod(r, LAP);
  FACTS.forEach((f, i) => {
    if (seen.has(i) || !!f.campus !== r < 0) return;
    if (f.plaque ? !isPlaque(c, lr) : c < f.c0 || c > f.c1 || lr < f.r0 || lr > f.r1) return;
    seen.add(i);
    toast(f.text);
  });
}

// ---------------------------------------------------------------- update
function update(dt) {
  time += dt;
  if (player.t < 1) {
    player.t = Math.min(1, player.t + dt / HOP_TIME);
    if (player.t >= 1 && player.queued && player.alive && state === 'play') {
      const q = player.queued;
      player.queued = null;
      doMove(q[0], q[1]);
    }
  }
  if (player.bump > 0) player.bump = Math.max(0, player.bump - dt * 7);

  if (state === 'play' || state === 'dying') { playT += dt; updateCreep(dt); }
  followCamera(dt);
  updateTraffic(dt);

  if (state === 'play' && player.alive) {
    const [x, y] = playerPos(), k = hitTest(x, y);
    if (k) die(k, x, y);
    else if (creepY > y - 0.2) die('crowd', x, y);
  }

  if (state === 'dying' || state === 'over') deathT += dt;
  if (state === 'dying' && deathT >= 1.0) showGameOver();
  if (shake > 0) shake = Math.max(0, shake - dt);

  const k = Math.exp(-3 * dt);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life) { particles.splice(i, 1); continue; }
    p.vx *= k; p.vy *= k; p.vr *= k;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
  if (state === 'play') pumpToasts();
}

// ---------------------------------------------------------------- boot
const finePointer = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
pxText(howEl, finePointer
  ? 'Arrow keys or WASD to hop. Turn down streets, and keep ahead of the gameday crowd!'
  : 'Tap to hop forward, swipe to turn down streets. The gameday crowd is right behind you!', PX.small);
pxText(startBestEl, best > 0 ? 'Best: ' + best : '', PX.small);
pxText(document.querySelector('h1 .a'), 'Jaywalk', PX.title);
pxText(document.querySelector('h1 .b'), 'Athens', PX.title2);
pxText(playBtn, 'Play', PX.btn);
pxText(againBtn, 'Play Again', PX.btn);
pxText(newBestEl, 'New best!', PX.badge);
document.querySelectorAll('.stat > span').forEach(el => pxText(el, el.textContent, PX.statLabel));

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

resize();
resetGame();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
