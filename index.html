<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d1b2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jaywalk Athens">
<title>Jaywalk Athens</title>
<style>
  :root {
    --ink:#1d1b2e; --ink2:#34304f; --accent:#ff6b2c; --accent-dark:#b8410f; --accent-lite:#ffa36e;
    --yellow:#ffd23f; --paper:#fff3d6; --paper2:#e8d3a6; --red:#e8364f; --muted:#6b6283;
  }
  * { box-sizing:border-box; }
  html, body {
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#1d1b2e; overscroll-behavior:none; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; text-size-adjust:100%;
  }
  body { position:fixed; inset:0; font-family:ui-monospace, Menlo, Consolas, "Courier New", monospace; color:#fff; }
  #game { position:absolute; left:0; top:0; display:block; touch-action:none; image-rendering:pixelated; }
  canvas.px { display:block; margin:0 auto; pointer-events:none; image-rendering:crisp-edges; image-rendering:pixelated; }
  .sr { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

  #hud {
    position:absolute; left:0; right:0; top:calc(env(safe-area-inset-top, 0px) + 14px); pointer-events:none;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  #score { color:#fff; }
  #hudBest { color:var(--yellow); }
  #street { color:#bfe3ff; min-height:14px; }
  .credit { margin:14px 0 0; font:10px/1.35 system-ui, sans-serif; color:var(--muted); }

  #toast {
    position:absolute; left:50%; top:calc(env(safe-area-inset-top, 0px) + 122px); transform:translateX(-50%);
    padding:9px 10px 8px; background:var(--ink); color:var(--yellow); border:3px solid var(--yellow);
    box-shadow:0 0 0 3px var(--ink), 6px 6px 0 3px rgba(0,0,0,.45); pointer-events:none; opacity:0;
  }
  #toast.show { animation:toast 2.4s steps(1, end) forwards; }
  @keyframes toast {
    0% { opacity:0; } 4% { opacity:1; } 8% { opacity:0; } 12% { opacity:1; } 16% { opacity:0; } 20% { opacity:1; }
    86% { opacity:1; } 90% { opacity:0; } 94% { opacity:1; } 100% { opacity:0; }
  }

  .overlay {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:24px 16px; padding-top:calc(env(safe-area-inset-top, 0px) + 24px); padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 24px);
    background:rgba(18,14,34,.45);
  }
  .hidden { display:none !important; }
  .card {
    position:relative; width:min(340px, 100%); background:var(--paper); color:var(--ink); padding:22px 18px 20px; text-align:center;
    border:4px solid var(--ink);
    box-shadow:inset 0 0 0 3px #fffaf0, inset 0 0 0 6px var(--paper2), 8px 8px 0 0 rgba(0,0,0,.55);
    animation:pop .3s steps(3, end) both;
  }
  @keyframes pop { from { transform:translateY(18px); opacity:0; } to { transform:none; opacity:1; } }
  .stripes { height:12px; width:132px; margin:0 auto 16px; background:repeating-linear-gradient(90deg, var(--ink) 0 12px, transparent 12px 20px); }
  h1 { margin:0; }
  h1 .a, h1 .b { display:block; }
  h1 .a { color:var(--ink); }
  h1 .b { color:var(--accent); margin-top:10px; }
  .how { margin:18px 0 20px; color:var(--muted); }
  .btn {
    appearance:none; -webkit-appearance:none; cursor:pointer; display:block; width:100%; padding:14px 12px; border-radius:0;
    background:var(--accent); color:#fff; font:inherit; border:4px solid var(--ink);
    box-shadow:inset -4px -5px 0 var(--accent-dark), inset 4px 4px 0 var(--accent-lite), 0 6px 0 var(--ink);
    touch-action:manipulation;
  }
  .btn:active { transform:translateY(4px); box-shadow:inset 4px 5px 0 var(--accent-dark), 0 2px 0 var(--ink); }
  .btn:focus-visible { outline:3px dashed var(--accent); outline-offset:4px; }
  .sub { margin:16px 0 0; color:var(--muted); min-height:14px; }
  h2 { margin:0 0 10px; color:var(--red); }
  .tag { margin:0 0 18px; color:var(--muted); }
  .stats { display:flex; gap:12px; margin-bottom:16px; }
  .stat {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; padding:12px 6px 14px;
    background:var(--ink); border:3px solid var(--ink); box-shadow:inset 0 0 0 3px var(--ink2);
  }
  .stat > span { display:block; color:#a59fc4; }
  .stat b { display:block; color:var(--yellow); }
  .badge {
    display:inline-block; margin:0 0 16px; padding:7px 9px 6px; background:var(--yellow); color:var(--ink);
    border:3px solid var(--ink); animation:blink 1s steps(1, end) infinite;
  }
  @keyframes blink { 50% { background:#fffaf0; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden"><div id="score">0</div><div id="hudBest">BEST 0</div><div id="street"></div></div>
<div id="toast"></div>

<div id="start" class="overlay">
  <div class="card">
    <div class="stripes"></div>
    <h1><span class="a">Jaywalk</span><span class="b">Athens</span></h1>
    <p class="how" id="how">Tap to hop forward, swipe to turn down streets. The gameday crowd is right behind you!</p>
    <button id="playBtn" class="btn" type="button">Play</button>
    <p class="sub" id="startBest"></p>
    <p class="credit">Street grid from OpenStreetMap. Map data &copy; OpenStreetMap contributors.</p>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <h2 id="overTitle">Flattened!</h2>
    <p class="tag" id="overTag">Should have looked both ways.</p>
    <div class="stats">
      <div class="stat"><span>Score</span><b id="finalScore">0</b></div>
      <div class="stat"><span>Best</span><b id="finalBest">0</b></div>
    </div>
    <div id="newBest" class="badge hidden">New best!</div>
    <button id="againBtn" class="btn" type="button">Play Again</button>
  </div>
</div>

<script>
(() => {
'use strict';

// ---------------------------------------------------------------- DOM
const $ = id => document.getElementById(id);
const canvas = $('game');
const mainCtx = canvas.getContext('2d');
const lo = document.createElement('canvas');   // low-res art buffer, scaled up with hard pixel edges
let ctx = lo.getContext('2d');   // swapped while the map is pre-painted
const hudEl = $('hud'), scoreEl = $('score'), hudBestEl = $('hudBest'), toastEl = $('toast');
const startEl = $('start'), overEl = $('over'), playBtn = $('playBtn'), againBtn = $('againBtn');
const startBestEl = $('startBest'), howEl = $('how');
const overTitleEl = $('overTitle'), overTagEl = $('overTag');
const finalScoreEl = $('finalScore'), finalBestEl = $('finalBest'), newBestEl = $('newBest');


// ---------------------------------------------------------------- constants
const VIEW_COLS = 11.5;      // tiles across a phone screen
const MIN_VIEW_ROWS = 14;    // on wide screens, always fit at least this many rows
const HOP_TIME = 0.11;       // seconds per hop
const CAM_FRAC = 0.3;        // player sits this fraction of the screen up from the bottom
const BEST_KEY = 'jaywalkAthens.downtown.best';
const WCOLS = 45;            // world width in tiles: Pulaski St on the west to the Classic Center on the east
const LAP = 37;              // rows in one pass of downtown, Broad St up past Dougherty St. Then it repeats.
const CAMPUS = 16;           // rows of North Campus below Broad St on the first lap
const START_COL = 25, START_ROW = -5;
const PLAY_C0 = 2, PLAY_C1 = 42;   // walkable columns (the outer buildings are scenery)

const CAR_COLORS = ['#e63946', '#2a6fdb', '#f4b400', '#2bb673', '#ececec', '#7b4fd6', '#ff7f3f', '#2f343c', '#4cc3e0'];
const CAR_SHAPES = {
  sedan:   { len: 1.45, ws: [0.08, 0.24], roof: [-0.2, 0.08],  rw: [-0.32, -0.2] },
  compact: { len: 1.2,  ws: [0.14, 0.3],  roof: [-0.26, 0.14], rw: [-0.4, -0.26] },
  pickup:  { len: 1.6,  ws: [0.16, 0.3],  roof: [-0.04, 0.16], rw: [-0.1, -0.04], bed: [-0.47, -0.13] },
};
const BUS_STRIPES = ['#1f9e89', '#e07a2e', '#3b6fd8', '#8e44ad'];
const WALLS = ['#a8473a', '#c4874f', '#6f8f72', '#3f5f86', '#d9c48f', '#8a5c9c', '#cf6f45', '#5d6b75', '#b5523b'];
const AWNINGS = [['#d62839', '#f7f3e8'], ['#2a9d8f', '#f7f3e8'], ['#264653', '#e9c46a'], ['#f4a261', '#fffaf0'],
                 ['#3a5a9a', '#f7f3e8'], ['#6a994e', '#f2e8cf'], ['#1b1f2a', '#e0e0e0']];
const DEATH_LINES = {
  car: [['Flattened!', 'Should have looked both ways.'], ['Splat!', 'That car was not stopping.']],
  bus: [['Hit by the bus!', 'Long, slow, and it still got you.'], ['Wrong stop!', 'That bus waits for no one.']],
  cop: [['Busted!', 'Jaywalking has consequences.'], ['Sirens!', 'You saw the lights, right?']],
  crowd: [['Swept up!', 'Swept up in the gameday crowd!'], ['Trampled!', 'The gameday crowd waits for no one.']],
};
const FACE_ANGLE = [0, Math.PI / 2, Math.PI, -Math.PI / 2]; // up, right, down, left

// ---------------------------------------------------------------- the street grid (OpenStreetMap, simplified)
// Streets west to east and south to north, in the real order. lanes[] lists travel direction per lane:
// north-south streets go west to east (-1 southbound, +1 northbound), east-west streets go south to north (+1 eastbound).
const VSTREETS = [
  { name: 'Pulaski St', c0: 3, lanes: [-1, 1] },
  { name: 'Hull St', c0: 10, lanes: [-1, -1] },           // one-way south
  { name: 'Lumpkin St', c0: 17, lanes: [1, 1] },          // one-way north
  { name: 'College Ave', c0: 24, lanes: [-1, 1] },        // College Square plaza between Broad and Clayton
  { name: 'Jackson St', c0: 31, lanes: [-1, 1] },
  { name: 'Thomas St', c0: 38, lanes: [-1, -1, 1, 1] },
];
const HSTREETS = [
  { name: 'Broad St', r0: 0, lanes: [1, 1, -1, -1], green: 5.2 },
  { name: 'Clayton St', r0: 9, lanes: [1, 1], green: 4 },      // one-way east
  { name: 'Washington St', r0: 16, lanes: [-1, -1], green: 4 }, // one-way west
  { name: 'Hancock Ave', r0: 23, lanes: [1, -1], green: 4 },
  { name: 'Dougherty St', r0: 30, lanes: [1, -1], green: 4 },
];
const COLLEGE = 3;
const BLOCK_C = [5, 12, 19, 26, 33];   // west sidewalk column of each block
const BLOCK_R = [4, 11, 18, 25, 32];   // south sidewalk row of each block (within a lap)

const COLK = [], ROWK = [];
for (let c = 0; c < WCOLS; c++) {
  let o = { k: 'edge' };
  VSTREETS.forEach((s, i) => { if (c >= s.c0 && c < s.c0 + s.lanes.length) o = { k: 'road', v: i, ln: c - s.c0 }; });
  BLOCK_C.forEach((b, i) => { if (c >= b && c < b + 5) o = { k: 'blk', b: i, lc: c - b }; });
  if (c === 2 || c === 42) o = { k: 'side' };
  COLK.push(o);
}
for (let r = 0; r < LAP; r++) {
  let o = null;
  HSTREETS.forEach((s, i) => { if (r >= s.r0 && r < s.r0 + s.lanes.length) o = { k: 'road', h: i, ln: r - s.r0 }; });
  BLOCK_R.forEach((b, i) => { if (r >= b && r < b + 5) o = { k: 'blk', b: i, lr: r - b }; });
  ROWK.push(o);
}

const mod = (a, n) => ((a % n) + n) % n;
const lapOf = y => Math.floor(y / LAP);
const okey = (c, r) => r * 64 + c;
const isWalkCol = c => { const k = COLK[c]; return !!k && (k.k === 'side' || (k.k === 'blk' && (k.lc === 0 || k.lc === 4))); };
const isWalkRow = r => { if (r === -1) return true; if (r < 0) return false; const k = ROWK[mod(r, LAP)]; return k.k === 'blk' && (k.lr === 0 || k.lr === 4); };
const vRoadCol = c => COLK[c] && COLK[c].k === 'road' && COLK[c].v !== COLLEGE;

// ---------------------------------------------------------------- North Campus (first lap only)
// Iron fence along Broad with the Arch at College Ave; the quad sits between Lumpkin and Jackson.
const GATES = [9, 16, 23, 26, 33, 37];   // gaps in the fence line up with the crosswalks; two flank the Arch so you can walk around it
const CAMPUS_BLDGS = [   // c, r = west column and south (front) row; buildings run w east and h north
  { id: 'chapel', c: 23, r: -11, w: 4, h: 3 },
  { id: 'bell', c: 27, r: -10, w: 1, h: 1 },
  { id: 'oldcollege', c: 23, r: -16, w: 4, h: 3 },
  { id: 'holmes', c: 19, r: -8, w: 3, h: 3 },
  { id: 'demos', c: 19, r: -13, w: 2, h: 2 },
  { id: 'phikappa', c: 29, r: -13, w: 2, h: 2 },
  { id: 'fountain', c: 28, r: -8, w: 2, h: 2 },
  { id: 'hall', c: 5, r: -10, w: 4, h: 3 },
  { id: 'hall', c: 12, r: -9, w: 4, h: 3 },
  { id: 'hall', c: 33, r: -9, w: 4, h: 3 },
  { id: 'hall', c: 12, r: -16, w: 3, h: 3 },
  { id: 'hall', c: 34, r: -16, w: 3, h: 3 },
];
const CAMPUS_MAP = [];   // index -1 - r
for (let i = 0; i < CAMPUS; i++) CAMPUS_MAP.push(new Array(WCOLS).fill('lawn'));
(function buildCampus() {
  const set = (c, r, k) => { if (c >= 0 && c < WCOLS && r < 0 && r >= -CAMPUS) CAMPUS_MAP[-1 - r][c] = k; };
  for (const b of CAMPUS_BLDGS) for (let i = 0; i < b.w; i++) for (let j = 0; j < b.h; j++) set(b.c + i, b.r + j, b.id === 'fountain' ? 'fount' : 'bldg');
  for (let c = 0; c < WCOLS; c++) { set(c, -1, 'side'); set(c, -2, 'fence'); set(c, -3, 'path'); }
  for (const g of GATES) { set(g, -2, 'gate'); set(g, -4, 'path'); }
  set(24, -2, 'arch'); set(25, -2, 'arch');
  for (let r = -4; r >= -8; r--) { set(24, r, 'path'); set(25, r, 'path'); }
  for (let c = 19; c <= 30; c++) set(c, -12, CAMPUS_MAP[11][c] === 'lawn' ? 'path' : CAMPUS_MAP[11][c]);
  // big old oaks, kept off the paths and away from the start
  for (let r = -4; r >= -CAMPUS; r--) for (let c = 0; c < WCOLS; c++) {
    if (CAMPUS_MAP[-1 - r][c] !== 'lawn' || vRoadCol(c)) continue;
    if (c >= 22 && c <= 27 && r >= -8) continue;
    const near = GATES.some(g => Math.abs(g - c) <= 1) && r >= -5;
    const h = Math.abs(Math.sin(c * 12.9898 + r * 78.233) * 43758.5453) % 1;
    if (!near && h < (c < 2 || c > 42 ? 0.5 : 0.17)) set(c, r, 'tree');
  }
  for (let r = -1; r >= -CAMPUS; r--) for (let c = 0; c < WCOLS; c++) if (vRoadCol(c)) set(c, r, 'road');
})();

function tileKind(c, r) {
  if (c < 0 || c >= WCOLS) return 'void';
  if (r < 0) return r < -CAMPUS ? 'void' : CAMPUS_MAP[-1 - r][c];
  const rk = ROWK[mod(r, LAP)], ck = COLK[c];
  if (rk.k === 'road') return 'road';
  if (ck.k === 'road') return ck.v === COLLEGE && rk.b === 0 ? 'plaza' : 'road';
  if (ck.k === 'side') return 'side';
  if (ck.k === 'edge') return rk.lr === 0 || rk.lr === 4 ? 'side' : 'bldg';
  return ck.lc === 0 || ck.lc === 4 || rk.lr === 0 || rk.lr === 4 ? 'side' : 'bldg';
}

// College Square has fixed planters, and the cannon sits on the corner of College and Hancock.
// Everything else that blocks a sidewalk comes from obstacles.
const CANNON_C = 23, CANNON_LR = 22;
const FIXED_BLOCK = new Set([okey(24, 6), okey(25, 7), okey(CANNON_C, CANNON_LR)]);
const SOLID = { bldg: 1, tree: 1, fence: 1, arch: 1, fount: 1, void: 1 };
function blocked(c, r) {
  if (c < PLAY_C0 || c > PLAY_C1 || r < -CAMPUS) return true;
  const k = tileKind(c, r);
  if (SOLID[k]) return true;
  if (r >= 0 && FIXED_BLOCK.has(okey(c, mod(r, LAP)))) return true;
  return obst.has(okey(c, r));
}

// ---------------------------------------------------------------- where am I? (HUD street name)
function placeName(c, r) {
  if (r < 0) return r === -1 ? 'Broad St' : 'North Campus';
  const lr = mod(r, LAP), rk = ROWK[lr], ck = COLK[c];
  if (c >= 9 && c <= 12 && lr >= 15 && lr <= 18) return 'Hot Corner';
  if (rk.k === 'road') return HSTREETS[rk.h].name;
  if (ck.k === 'road') return ck.v === COLLEGE && rk.b === 0 ? 'College Square' : VSTREETS[ck.v].name;
  if (rk.lr === 0) return HSTREETS[rk.b].name;
  if (rk.lr === 4) return HSTREETS[(rk.b + 1) % 5].name;
  if (ck.k === 'blk') return VSTREETS[ck.lc === 0 ? ck.b : ck.b + 1].name;
  return c < 20 ? 'Pulaski St' : 'Thomas St';
}

// ---------------------------------------------------------------- landmark facts, shown once per run
// rect in columns c0..c1 and lap rows r0..r1 (campus ones use real negative rows and only exist on lap one)
const FACTS = [
  { c0: 22, c1: 27, r0: -4, r1: -1, campus: 1, text: 'The Arch: legend says walk under it before you graduate and you never will.' },
  { c0: 22, c1: 28, r0: -8, r1: -7, campus: 1, text: 'The Chapel bell gets rung after big wins.' },
  { c0: 18, c1: 22, r0: -5, r1: -5, campus: 1, text: 'Holmes-Hunter: named for the first two Black students admitted, in 1961.' },
  { c0: 27, c1: 30, r0: -6, r1: -5, campus: 1, text: 'Herty Field: the first football game on campus was played here in 1892.' },
  { c0: 23, c1: 26, r0: 4, r1: 8, text: 'College Square: this block of College Ave is a pedestrian plaza now.' },
  { c0: 13, c1: 17, r0: 11, r1: 11, text: 'Georgia Theatre: gutted by fire in 2009, rebuilt with a rooftop bar.' },
  { c0: 9, c1: 12, r0: 15, r1: 18, text: 'Hot Corner: Washington and Hull, long the heart of Black business in Athens.' },
  { c0: 12, c1: 15, r0: 18, r1: 18, text: 'Morton Theatre, 1910: one of the first Black-owned vaudeville theatres in the country.' },
  { c0: 5, c1: 9, r0: 18, r1: 18, text: '40 Watt: the club at the center of the Athens music scene.' },
  { c0: 2, c1: 42, r0: 15, r1: 15, plaque: 1, text: 'Athens Music Walk of Fame: bronze plaques honor local musicians.' },
  { c0: 21, c1: 24, r0: 21, r1: 23, text: 'Double-Barreled Cannon, 1863: meant to fire two balls joined by a chain. It never worked. It still points north.' },
  { c0: 14, c1: 17, r0: 22, r1: 23, text: 'Athens First United Methodist, at Hancock and Lumpkin.' },
  { c0: 26, c1: 30, r0: 18, r1: 18, text: 'U.S. Post Office and Courthouse: federal stone and columns.' },
  { c0: 33, c1: 37, r0: 18, r1: 18, text: 'Athens-Clarke County Courthouse, on Washington St.' },
  { c0: 12, c1: 14, r0: 25, r1: 25, text: "Cine: downtown's independent movie house." },
  { c0: 26, c1: 30, r0: 25, r1: 25, text: 'Denney Tower: one of the tallest buildings downtown.' },
  { c0: 33, c1: 37, r0: 32, r1: 32, text: 'Church-Waddel-Brumby House, about 1820: likely the oldest house in Athens. Now the Welcome Center.' },
  { c0: 41, c1: 42, r0: 11, r1: 22, text: 'The Classic Center: arena, theatre and convention hall on Thomas St.' },
  { c0: 41, c1: 42, r0: 25, r1: 36, text: 'The old Athens Foundry cast the double-barreled cannon in 1863.' },
];
const PLAQUE_ROWS = [15, 18];
const isPlaque = (c, lr) => PLAQUE_ROWS.includes(lr) && isWalkCol(c) === false && COLK[c].k === 'blk' && (COLK[c].lc === 1 || COLK[c].lc === 3);

// ---------------------------------------------------------------- state
const player = {
  col: START_COL, row: START_ROW, fromCol: START_COL, fromRow: START_ROW, t: 1, face: 0, queued: null, alive: true,
  bump: 0, bumpFace: 0, deadX: 0, deadY: 0, deadRot: 0,
};
let state = 'menu';       // menu | play | dying | over
let freshWorld = false;
let camX = 0, camY = 0, drawCX = 0, drawCY = 0, maxRow = START_ROW, best = loadBest(), shake = 0, deathT = 0;
let killer = 'car', isNewBest = false, creepY = -CAMPUS, creepOn = false, playT = 0, lapShown = 0, archToastAt = -9;
let particles = [], time = 0, inputLockUntil = 0, overShownAt = 0, streetName = '';
let W = 0, H = 0, DPR = 1, T = 40, HB = 0, rowsVis = 20, viewCols = 11;
let P = 1, RS = 1, TN = 16, scanPat = null;   // device px per art px, art px per CSS px, art px per tile

const hLanes = new Map();   // absolute row -> east-west lane
let vLanes = [];            // north-south through lanes
const colLanes = new Map(); // College Ave segments (Clayton to the next Broad), keyed lap*2+lane
const obst = new Map();     // okey -> sidewalk obstacle type
const lapsMade = new Set();
const seen = new Set();     // landmark facts already shown this run
const score = () => Math.max(0, maxRow - START_ROW);

// ---------------------------------------------------------------- helpers
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const easeOut = t => 1 - (1 - t) * (1 - t);

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }

// deterministic per-world hash for scenery, so decorations don't flicker frame to frame

// ---------------------------------------------------------------- traffic signals
// Every intersection runs its own cycle: east-west green, yellow, all red, north-south green, yellow, all red.
// The offset comes from a fixed hash, so a given corner always behaves the same way.
const YEL = 1, ALL_RED = 0.6, NS_GREEN = 4;

// ---------------------------------------------------------------- vehicles
function makeVehicle(type, L) {

    o = { kind: 'bus', len: 2.9, stripe, stripeDark: shade(stripe, -0.35), vmax: rand(2.8, 3.4) };
  } else if (type === 'cop') o = { kind: 'cop', len: 1.5, phase: Math.random() * 2, vmax: rand(5.4, 6.4) };

    o = { kind: 'car', style, len: CAR_SHAPES[style].len, color, dark: shade(color, -0.32), light: shade(color, 0.22), vmax: rand(3.6, 5) };
  }

// where a car is and which way it points (screen angle: 0 east, PI/2 south). Turning cars swing between two poses.
function carPose(car, ln) {

  else { x = ln.c + 0.5; y = car.y; a = ln.dir > 0 ? -Math.PI / 2 : Math.PI / 2; }
  if (car.turn) { const e = easeOut(car.turn.t); x = lerp(car.turn.fx, x, e); y = lerp(car.turn.fy, y, e); a = lerp(car.turn.fa, a, e); }

// distance a car may still roll before it must stop for a light, or to keep from blocking an intersection

    if (d < -0.05) continue;
    if (d > 9) break;
    const sg = sigf(st);
    if (sg === 2 || (sg === 1 && d >= car.v * car.v / (2 * BRAKE) * 0.8 - 0.02)) return d;
    if (d < 2.5 && ldV < 2 && ldBack < st.far + car.len + GAP) return d;

// ---------------------------------------------------------------- east-west lanes: one per road row, looping out of sight
const HLEN = WCOLS + 8;
const hx = (ln, s) => (ln.dir > 0 ? s - 4 : WCOLS + 4 - s);

function makeHLane(row) {
  const rk = ROWK[mod(row, LAP)], L = lapOf(row), dir = HSTREETS[rk.h].lanes[rk.ln];
  const ln = { row, h: rk.h, ln: rk.ln, lap: L, dir, cars: [], stops: [] };
  VSTREETS.forEach((v, i) => {
    const a = v.c0 - 1.1, b = v.c0 + v.lanes.length + 1.1;   // stop lines sit behind the crosswalks
    ln.stops.push(dir > 0 ? { v: i, u: a + 4, far: b + 4 } : { v: i, u: WCOLS + 4 - b, far: WCOLS + 4 - a });
  });

  for (let s = rand(0, 5); s < HLEN - 3;) {

    car.s = s + car.len / 2;
    ln.cars.push(car);
    s += car.len + rand(2.6, 9) * gapK;
  }

function hClear(ln, s, len) {
  for (const c of ln.cars) {
    const gap = Math.abs(c.s - s) - (c.len + len) / 2;
    if (gap < 0.5 || (c.s < s && gap < 0.5 + c.v * 0.6)) return false;

function updateHLane(ln, dt) {
  const cars = ln.cars, n = cars.length;
  if (!n) return;
  cars.sort((a, b) => a.s - b.s);
  const sigf = st => ewSig(st.v, ln.h, ln.lap);
  let gone = false;
  for (let i = 0; i < n; i++) {
    const car = cars[i], front = car.s + car.len / 2;
    if (car.turn && (car.turn.t += dt / TURN_TIME) >= 1) car.turn = null;
    let ldBack = 1e9, ldV = 99;
    if (n > 1) { const ld = cars[(i + 1) % n]; ldBack = ld.s - ld.len / 2 + (i + 1 === n ? HLEN : 0); ldV = ld.v; }
    if (car.turner && turnIntoCollege(ln, car, front)) { car.gone = gone = true; continue; }
    const free = Math.min(ldBack - front - GAP, stopFree(ln.stops, front, car, ldBack, ldV, sigf));
    car.s += stepCar(car, free, dt);

// ---------------------------------------------------------------- north-south lanes
function vStops(dir, lo, hi) {   // stop lines (in travel units) for every cross street between rows lo and hi
  const out = [];
  for (let L = Math.max(0, lapOf(lo) - 1); L <= lapOf(hi); L++) HSTREETS.forEach((h, i) => {
    const a = L * LAP + h.r0 - 1.1, b = L * LAP + h.r0 + h.lanes.length + 1.1;
    out.push(dir > 0 ? { h: i, L, u: a, far: b } : { h: i, L, u: -b, far: -a });
  });
  return out.sort((p, q) => p.u - q.u);
}

function makeVLane(v, i) {
  const s = VSTREETS[v];
  return { v, c: s.c0 + i, dir: s.lanes[i], cars: [], seg: null, fLo: 0, fHi: -1, next: rand(0.3, 2) };
}

    car.y = y + car.len / 2;
    ln.cars.push(car);
    y += car.len + rand(3, 11) * (1 - Math.min(0.3, 0.07 * L));
  }
}

// College Ave only runs from Clayton St north to the next Broad St (College Square is closed to cars),
// so its cars arrive by turning in off Clayton or Broad and leave by turning back out.
function makeColLane(L, i) {
  const s = VSTREETS[COLLEGE];
  const ln = { v: COLLEGE, c: s.c0 + i, dir: s.lanes[i], cars: [], seg: [L * LAP + 9, (L + 1) * LAP + 4], L };
  ln.endU = ln.dir > 0 ? (L + 1) * LAP - 1.1 : -(L * LAP + 12.1);
  ln.stops = vStops(ln.dir, L * LAP, (L + 1) * LAP + 4).filter(st => !(st.h === 1 && st.L === L) && !(st.h === 0 && st.L === L + 1));
  for (let y = L * LAP + 13.5 + rand(0, 3); y < (L + 1) * LAP - 2.5;) {
    const car = makeVehicle(vehType(false, L), L);
    car.y = y;
    ln.cars.push(car);
    y += car.len + rand(3.5, 10);
  }

function turnIntoCollege(ln, car, front) {

  } else if (ln.h === 0 && ln.ln === 2 && ln.lap > 0) {             // Broad westbound, left onto College southbound
    if (nsSig(COLLEGE, 0, ln.lap) !== 0) return false;
    tgt = colLanes.get((ln.lap - 1) * 2); y = ln.lap * LAP + 2.9 - car.len / 2;

  else { row = (ln.L + 1) * LAP; x = ln.c + 0.4 + car.len / 2; }

function updateVLane(ln, dt) {
  const cars = ln.cars, d = ln.dir;

  cars.sort((a, b) => a.u - b.u);

  let gone = false;

function manageVLane(ln, dt) {   // keep a lane stocked just past both screen edges, and feed cars in at its entry end
  const lo = camY - 4, hi = camY + rowsVis + 4;
  if (ln.fHi < ln.fLo) { fillVLane(ln, lo, hi); ln.fLo = lo; ln.fHi = hi; }
  if (hi > ln.fHi) { fillVLane(ln, Math.max(ln.fHi, lo), hi); ln.fHi = hi; }
  if (lo < ln.fLo) { fillVLane(ln, lo, Math.min(ln.fLo, hi)); ln.fLo = lo; }
  ln.fLo = Math.max(ln.fLo, lo - 3);

// ---------------------------------------------------------------- sidewalk clutter
const OBST_TYPES = ['cone', 'cone', 'barrier', 'planter', 'scooter', 'bench', 'patio', 'patio'];
function placeObstacles(L) {
  lapsMade.add(L);
  const want = Math.min(26, 8 + L * 4);
  for (let made = 0, tries = 0; made < want && tries < 500; tries++) {
    const b = randi(0, 4), br = randi(0, 4), c0 = BLOCK_C[b], r0 = BLOCK_R[br], along = Math.random() < 0.6;
    const c = along ? c0 + randi(1, 3) : c0 + (Math.random() < 0.5 ? 0 : 4);
    const lr = along ? r0 + (Math.random() < 0.5 ? 0 : 4) : r0 + randi(1, 3);
    const r = L * LAP + lr;
    if (isPlaque(c, lr) || obst.has(okey(c, r))) continue;
    if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dc, dr]) => obst.has(okey(c + dc, r + dr)))) continue;
    let t = pick(OBST_TYPES);
    if (t === 'patio' && !along) t = 'planter';
    obst.set(okey(c, r), t);
    made++;

// ---------------------------------------------------------------- per-frame traffic upkeep
function manageTraffic(dt) {
  const lo = camY - 3, hi = camY + rowsVis + 3;
  for (let r = Math.max(0, Math.floor(lo)); r <= Math.ceil(hi); r++)
    if (!hLanes.has(r) && ROWK[mod(r, LAP)].k === 'road') hLanes.set(r, makeHLane(r));
  for (const r of hLanes.keys()) if (r < lo - 4 || r > hi + 6) hLanes.delete(r);
  for (let L = Math.max(0, lapOf(lo) - 1); L <= lapOf(hi); L++) {
    if (L * LAP + 9 > hi + 1 || (L + 1) * LAP + 4 < lo - 1) continue;
    for (const i of [0, 1]) if (!colLanes.has(L * 2 + i)) colLanes.set(L * 2 + i, makeColLane(L, i));
  }
  for (const [k, ln] of colLanes) if (ln.seg[0] > hi + 7 || ln.seg[1] < lo - 7) colLanes.delete(k);
  for (const ln of vLanes) manageVLane(ln, dt);
  for (let L = Math.max(0, lapOf(lo)); L <= lapOf(hi + 12); L++) if (!lapsMade.has(L)) placeObstacles(L);
}

function updateTraffic(dt) {
  manageTraffic(dt);
  for (const ln of hLanes.values()) updateHLane(ln, dt);
  for (const ln of vLanes) updateVLane(ln, dt);
  for (const ln of colLanes.values()) updateVLane(ln, dt);
}

function resetTraffic() {
  hLanes.clear(); colLanes.clear(); obst.clear(); lapsMade.clear();
  vLanes = [];
  VSTREETS.forEach((s, v) => { if (v !== COLLEGE) s.lanes.forEach((_, i) => vLanes.push(makeVLane(v, i))); });
  for (let i = 0; i < 90; i++) { time += 1 / 30; updateTraffic(1 / 30); }   // let it settle so it doesn't look freshly dealt
}

// ---------------------------------------------------------------- collisions
function hitTest(px, py) {
  const R = 0.26;
  const hit = (car, ln) => {
    const p = carPose(car, ln), horiz = Math.abs(Math.cos(p.a)) > 0.7;
    const hw = car.kind === 'bus' ? 0.38 : 0.3, hl = car.len / 2 - 0.08;
    return Math.abs(p.x - px) < (horiz ? hl : hw) + R && Math.abs(p.y - py) < (horiz ? hw : hl) + R;
  };
  for (let r = Math.floor(py) - 2; r <= Math.floor(py) + 2; r++) {
    const ln = hLanes.get(r);
    if (ln) for (const car of ln.cars) if (hit(car, ln)) return car.kind;
  }
  for (const ln of vLanes) if (Math.abs(ln.c + 0.5 - px) < 2) for (const car of ln.cars) if (hit(car, ln)) return car.kind;
  for (const ln of colLanes.values()) if (Math.abs(ln.c + 0.5 - px) < 2.5) for (const car of ln.cars) if (hit(car, ln)) return car.kind;
  return null;
}

// ---------------------------------------------------------------- the gameday crowd that sweeps up from behind
function updateCreep(dt) {
  if (!creepOn) { if (playT < 1.5) return; creepOn = true; }
  const L = Math.max(0, lapOf(Math.max(0, player.row)));
  let sp = Math.min(1.1, 0.36 + 0.08 * L + 0.004 * playT);
  const d = player.row + 0.5 - creepY;       // they surge to about four rows behind you, then keep marching
  if (d > 4.5) sp *= 1 + (d - 4.5) * 0.8;
  creepY += sp * dt;
}

// ---------------------------------------------------------------- drawing helpers
// The world is painted into a small offscreen canvas (about 16 art pixels per tile) and then blown up
// with hard edges. Everything below snaps to that art-pixel grid so shapes stay crisp and blocky.

const snap = v => Math.round(v * RS) / RS;

function fr(x, y, w, h) {              // fillRect snapped to art pixels, never thinner than one pixel

  let x1 = Math.round((x + w) * RS), y1 = Math.round((y + h) * RS);
  if (x1 === x0) x1 += w > 0 ? 1 : -1;

}
function ellipse(x, y, rx, ry, c) {     // pixel ellipse: one run of pixels per row, no soft edges

  for (let py = Math.round(cy - b), end = Math.round(cy + b); py < end; py++) {
    const t = (py + 0.5 - cy) / b, hw = a * Math.sqrt(Math.max(0, 1 - t * t));
    const xa = Math.round(cx - hw), xb = Math.round(cx + hw);
    if (xb > xa) ctx.fillRect(xa / RS, py / RS, (xb - xa) / RS, 1 / RS);
  }

function ring(x, y, r, th, c) {         // pixel ring: outer radius r (CSS px), th art pixels thick
  ctx.fillStyle = c;

  for (let py = Math.round(cy - ro), end = Math.round(cy + ro); py < end; py++) {
    const dy = py + 0.5 - cy;
    const ho = Math.sqrt(Math.max(0, ro * ro - dy * dy)), hi = Math.abs(dy) < ri ? Math.sqrt(ri * ri - dy * dy) : 0;
    const a = Math.round(cx - ho), b = Math.round(cx - hi), d = Math.round(cx + hi), e = Math.round(cx + ho);
    if (b > a) ctx.fillRect(a / RS, py / RS, (b - a) / RS, 1 / RS);

function fillRR(x, y, w, h, r, c) {     // blocky rounded rect: corners notched by one or two pixels
  ctx.fillStyle = c;

  if (x1 < x0) { const t = x0; x0 = x1; x1 = t; }

// ---------------------------------------------------------------- map art, painted once per resize
// The map never changes, so one lap of downtown and the strip of North Campus are painted into offscreen

// GLOWS become a light layer that fades in after sunset.

const Y = r => (rowY0 - r) * T;
const YW = yy => (rowY0 + 1 - yy) * T;        // a world y coordinate (rows count up from the south) inside that canvas
const LIVE = [], GLOWS = [];
const glow = (x, y, r, c) => GLOWS.push({ x, y, r, c: c || '255,198,120' });

const roadK = (c, r) => kindAt(c, r) === 'road';

function newCanvas(w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv; }
function paintInto(cv, y0, fn) {
  const keep = ctx;
  ctx = cv.getContext('2d');
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  ctx.imageSmoothingEnabled = false;
  rowY0 = y0;
  fn();
  ctx = keep;
}

// ---------------------------------------------------------------- ground tiles
function asphalt(c, r) {
  at(c, r);
  const n = TN;
  px(0, 0, n, n, '#3d3f4b');
  for (let k = 0; k < 4; k++) px(Math.floor(hash(c, r, 70 + k) * n), Math.floor(hash(c, r, 80 + k) * n), 1, 1, k & 1 ? '#4b4e5c' : '#33353f');
  const h = hash(c, r, 99);
  if (h < 0.05) {                               // patched pothole
    const i = 3 + Math.floor(hash(c, r, 98) * (n - 8)), j = 3 + Math.floor(hash(c, r, 97) * (n - 8));
    px(i, j, 4, 3, '#34363f'); px(i + 1, j + 1, 2, 1, '#26282f');
  } else if (h > 0.97) {                        // manhole
    const i = 3 + Math.floor(hash(c, r, 96) * (n - 9)), j = 3 + Math.floor(hash(c, r, 95) * (n - 9));
    px(i + 1, j, 3, 5, '#2b2d35'); px(i, j + 1, 5, 3, '#2b2d35'); px(i + 1, j + 2, 3, 1, '#4b4e5c');
  }
}

function sidewalk(c, r) {
  at(c, r);
  const n = TN, h = hash(c, r, 11);
  px(0, 0, n, n, h < 0.3 ? '#d7d3c8' : h > 0.85 ? '#c3beb2' : '#cdc8bc');
  px(0, 0, n, 1, '#e6e2d8'); px(0, 0, 1, n, '#e6e2d8');
  px(0, n - 1, n, 1, '#b3aea3'); px(n - 1, 0, 1, n, '#b3aea3');
  if (hash(c, r, 12) < 0.3) {                   // a hairline crack
    let i = 2 + Math.floor(hash(c, r, 13) * (n - 6)), j = 2 + Math.floor(hash(c, r, 14) * (n - 6));
    ctx.fillStyle = '#a19c91';
    for (let k = 0; k < 4; k++) { px(i, j, 1, 1); i += 1; j += hash(c, r, 15 + k) < 0.5 ? 1 : 0; }
  }
}

function plaza(c, r) {                          // College Square: warm pavers in a running bond
  at(c, r);
  const n = TN;
  px(0, 0, n, n, '#d9c9a5');
  ctx.fillStyle = '#cbb68b';
  for (let j = 0; j < n; j += 3) {
    px(0, j, n, 1);
    for (let i = (j / 3) & 1 ? 2 : 0; i < n; i += 4) px(i, j + 1, 1, 2);
  }
  if (hash(c, r, 16) < 0.5) px(Math.floor(hash(c, r, 17) * (n - 3)) + 1, Math.floor(hash(c, r, 18) * 4) * 3 + 1, 3, 2, '#ad9a73');
}

function pavers(c, r) {                         // campus walks: pale stone
  at(c, r);
  const n = TN;
  px(0, 0, n, n, '#d8ceb4');
  ctx.fillStyle = '#bfb294';
  for (let j = 0; j < n; j += 4) {
    px(0, j, n, 1);
    for (let i = (j / 4) & 1 ? 3 : 0; i < n; i += 6) px(i, j + 1, 1, 3);
  }
}

function lawn(c, r) {                           // mowed in stripes, a few tufts
  at(c, r);
  const n = TN;
  px(0, 0, n, n, c & 1 ? '#5c9e48' : '#56973f');
  for (let k = 0; k < 5; k++) px(Math.floor(hash(c, r, 20 + k) * n), Math.floor(hash(c, r, 30 + k) * (n - 1)), 1, 2, k & 1 ? '#72b55a' : '#4b8a3b');
}

function paintGround(c, r) {
  const k = tileKind(c, r);
  if (k === 'road') asphalt(c, r);
  else if (k === 'side') sidewalk(c, r);
  else if (k === 'plaza') plaza(c, r);
  else if (k === 'path' || k === 'gate' || k === 'arch') pavers(c, r);
  else if (k === 'bldg' && !campusMode) { at(c, r); px(0, 0, TN, TN, '#2a2630'); }
  else lawn(c, r);
}

// ---------------------------------------------------------------- road markings and curbs
function laneLine(c, r, yellow, alongX) {   // on the boundary to the next lane: top edge for east-west, right edge for north-south
  at(c, r);
  const n = TN;
  if (alongX) {
    if (yellow) { px(0, -2, n, 1, '#f2c230'); px(0, 1, n, 1, '#f2c230'); } else px(n >> 2, 0, n >> 1, 1, '#e6e4da');
  } else if (yellow) { px(n - 2, 0, 1, n, '#f2c230'); px(n + 1, 0, 1, n, '#f2c230'); } else px(n - 1, n >> 2, 1, n >> 1, '#e6e4da');
}

function zebra(c, r, acrossH) {             // continental crosswalk: bars run with the traffic
  at(c, r);
  const n = TN, w = Math.max(2, Math.round(n / 8));
  ctx.fillStyle = '#e9e6dc';
  for (let k = w >> 1; k + w <= n; k += 2 * w) if (acrossH) px(2, k, n - 4, w); else px(k, 2, w, n - 4);
}

function paintMarks(c, r) {
  if (tileKind(c, r) !== 'road') return;
  const ck = COLK[c], rk = campusMode ? null : ROWK[r];
  const hRoad = !!rk && rk.k === 'road', vRoad = ck.k === 'road';
  if (hRoad && vRoad) return;                 // inside an intersection: bare asphalt
  at(c, r);
  if (hRoad) {
    const lanes = HSTREETS[rk.h].lanes, dir = lanes[rk.ln];
    const wOfRoad = COLK[c + 1] && COLK[c + 1].k === 'road', eOfRoad = COLK[c - 1] && COLK[c - 1].k === 'road';
    if (isWalkCol(c) && (wOfRoad || eOfRoad)) {
      zebra(c, r, true);
      if (dir > 0 && wOfRoad) px(-2, 1, 2, TN - 2, '#e9e6dc');          // eastbound stop line, before the crosswalk
      if (dir < 0 && eOfRoad) px(TN, 1, 2, TN - 2, '#e9e6dc');
    } else if (rk.ln + 1 < lanes.length) laneLine(c, r, dir !== lanes[rk.ln + 1], true);
    return;
  }
  const lanes = VSTREETS[ck.v].lanes, dir = lanes[ck.ln];
  const southOfRoad = campusMode ? r === -1 : rk.lr === 4, northOfRoad = !campusMode && rk.lr === 0;
  if (southOfRoad || northOfRoad) {
    zebra(c, r, false);
    if (dir > 0 && southOfRoad) px(1, TN, TN - 2, 2, '#e9e6dc');        // northbound stop line
    if (dir < 0 && northOfRoad) px(1, -2, TN - 2, 2, '#e9e6dc');
  } else if (ck.ln + 1 < lanes.length) laneLine(c, r, dir !== lanes[ck.ln + 1], false);
}

function curbs(c, r) {
  const k = tileKind(c, r);
  if (k !== 'side' && k !== 'plaza') return;
  at(c, r);
  const n = TN, brick = !campusMode && k === 'side';
  const edge = (i, j, w, h, di, dj) => {      // brick band, then the curb face
    if (brick) {
      px(i + di * 2, j + dj * 2, w ? w : 3, h ? h : 3, '#b8644b');
      ctx.fillStyle = '#7f3a2b';
      for (let t = 1; t < n; t += 3) if (w) px(i + t, j + dj * 2 + 1, 1, 1); else px(i + di * 2 + 1, j + t, 1, 1);
    }
    px(i, j, w || 1, h || 1, '#8f8b80');
    px(i + di, j + dj, w || 1, h || 1, '#ebe7dc');
  };
  if (roadK(c, r + 1)) edge(0, 0, n, 0, 0, 1);
  if (roadK(c, r - 1)) edge(0, n - 1, n, 0, 0, -1);
  if (roadK(c - 1, r)) edge(0, 0, 0, n, 1, 0);
  if (roadK(c + 1, r)) edge(n - 1, 0, 0, n, -1, 0);
}

// ---------------------------------------------------------------- rooftops
function roofArea(c0, r0, w, h, base) {        // flat tar roofs over a w x h tile footprint whose south-west tile is (c0, r0)
  ox = c0 * T; oy = Y(r0 + h - 1);
  const Wp = w * TN, Hp = h * TN, n = TN;
  px(0, 0, Wp, Hp, base || '#4a4550');
  for (let k = 0; k < w * h * 5; k++) px(Math.floor(hash(c0, r0, 200 + k) * Wp), Math.floor(hash(c0, r0, 300 + k) * Hp), 1, 1, k & 1 ? '#57525e' : '#403b46');
  for (let i = 1; i < w; i++) px(i * n, 0, 1, Hp, '#36323c');
  px(0, 0, Wp, 1, '#6a6472'); px(0, 0, 1, Hp, '#5e5866');
  px(0, Hp - 1, Wp, 1, '#2e2a33'); px(Wp - 1, 0, 1, Hp, '#2e2a33');
  for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) {
    const f = hash(c0 + i, r0 + j, 61), x = i * n + 3 + Math.floor(hash(c0 + i, r0 + j, 62) * (n - 9)), y = j * n + 3 + Math.floor(hash(c0 + i, r0 + j, 63) * (n - 9));
    if (f < 0.35) {                            // AC unit with a fan
      px(x, y, 6, 5, '#9aa1a8'); px(x, y + 4, 6, 1, '#6e757c'); px(x + 1, y + 1, 3, 3, '#5f666d'); px(x + 2, y + 2, 1, 1, '#c6ccd2');
    } else if (f < 0.55) {                     // skylight
      px(x, y, 5, 4, '#2f3a48'); px(x + 1, y + 1, 3, 2, '#7fa6c4'); px(x + 1, y + 1, 1, 1, '#d6ecff');
    } else if (f < 0.7) {                      // vent stacks
      px(x, y, 2, 2, '#7d838a'); px(x + 4, y + 2, 2, 2, '#7d838a'); px(x, y + 2, 2, 1, '#2a2d33');
    } else if (f < 0.76 && h > 1) {            // wooden water tank on legs
      px(x, y + 5, 1, 2, '#2a2d33'); px(x + 5, y + 5, 1, 2, '#2a2d33');
      px(x, y, 6, 5, '#8a5a3a'); px(x + 1, y - 1, 4, 1, '#6b4430'); px(x, y + 2, 6, 1, '#5e3c28');
    }
  }
}

// gabled roof for houses: shingles in courses, ridge across the middle
function gable(c, r, col) {
  at(c, r);
  const n = TN, dark = shade(col, -0.3);
  px(0, 0, n, n, col);
  ctx.fillStyle = dark;
  for (let j = 2; j < n; j += 3) px(0, j, n, 1);
  px(0, (n >> 1) - 1, n, 2, shade(col, 0.25));
  px(0, 0, 1, n, dark); px(n - 1, 0, 1, n, dark);
  if (hash(c, r, 64) < 0.6) { px(3 + Math.floor(hash(c, r, 65) * (n - 8)), 1, 3, 4, '#8a3b2c'); }   // chimney
}

// ---------------------------------------------------------------- street furniture painted into the map
function lampPost(x, y) {                      // x, y: base point in canvas px
  const q = 1 / RS;
  ellipse(x + T * 0.08, y + q, T * 0.1, T * 0.04, 'rgba(0,0,0,0.25)');
  ctx.fillStyle = '#1f2d26';
  fr(x - q, y - T * 0.5, 2 * q, T * 0.5);
  fr(x - 2 * q, y - q, 4 * q, 2 * q);
  fr(x - 2 * q, y - T * 0.5 - 2 * q, 4 * q, 2 * q);
  ctx.fillStyle = '#fff1c2';
  fr(x - q, y - T * 0.5 - q, 2 * q, q);
  glow(x, y - T * 0.5, T * 1.1, '255,214,140');
}

function planter(c, r) {
  at(c, r);
  const n = TN;
  px(1, 3, n - 2, n - 4, '#7f3a2b');
  px(2, 4, n - 4, n - 6, '#a3543e');
  px(3, 4, n - 6, n - 8, '#4a3a2a');
  for (let k = 0; k < 9; k++) {
    const i = 3 + Math.floor(hash(c, r, 40 + k) * (n - 7)), j = 2 + Math.floor(hash(c, r, 50 + k) * (n - 8));
    px(i, j, 2, 2, k % 3 ? '#3e9a47' : '#2f7d3a');
    if (k % 4 === 0) px(i, j, 1, 1, k & 1 ? '#ff6b8a' : '#ffd23f');
  }
}

function plaque(c, r) {                        // Music Walk of Fame: a bronze square set in the sidewalk
  at(c, r);
  const n = TN, s = Math.max(5, Math.round(n * 0.44)), i = (n - s) >> 1;
  px(i, i, s, s, '#6e4e22');
  px(i + 1, i + 1, s - 2, s - 2, '#b08440');
  px(i + 1, i + 1, s - 2, 1, '#e0b868');
  const m = i + (s >> 1);                      // a tiny eighth note
  px(m, i + 2, 1, s - 4, '#5a3e18'); px(m - 2, i + s - 3, 2, 2, '#5a3e18'); px(m + 1, i + 2, 1, 1, '#5a3e18');
}

function cannon(c, r) {                        // the double-barreled cannon, both muzzles pointing north
  at(c, r);
  const n = TN, k = Math.max(1, n >> 4);
  px(1, 2, n - 2, n - 3, '#9c968a');           // granite base
  px(2, 3, n - 4, n - 5, '#b9b3a6');
  px(1, n - 2, n - 2, 1, '#77726a');
  const b0 = (n >> 1) - 3 * k, bw = 2 * k;
  for (const i of [b0, b0 + 4 * k]) {          // two barrels side by side
    px(i, 1, bw, n - 6, '#2c2f33');
    px(i, 1, bw, k, '#4a4f55');
    px(i + (bw >> 1), 1, Math.max(1, k), 1, '#0e0f11');
  }
  px(b0 - k, n - 7, 6 * k + bw, 2 * k, '#2c2f33');  // breech block
  px(2, n - 8, 2 * k + 1, 5, '#5a3e24'); px(n - 3 - 2 * k, n - 8, 2 * k + 1, 5, '#5a3e24');   // wheels
}

function stringLights(c0, c1, r) {             // over College Square
  const y = Y(r) + T * 0.15, q = 1 / RS;
  ctx.fillStyle = '#2a2630';
  fr(c0 * T, y, (c1 - c0 + 1) * T, q);
  for (let x = c0 * T + 2 * q; x < (c1 + 1) * T; x += 4 * q) {
    ctx.fillStyle = '#f7e7b0'; fr(x, y + q, q, q);
    glow(x, y + q, T * 0.35, '255,220,150');
  }
}

function paintStreetDecor() {
  for (let r = 0; r < LAP; r++) for (let c = 0; c < WCOLS; c++) if (isPlaque(c, r)) plaque(c, r);
  planter(24, 6); planter(25, 7);
  stringLights(23, 26, 5); stringLights(23, 26, 7);
  cannon(CANNON_C, CANNON_LR);
  for (const v of VSTREETS) for (const h of HSTREETS) {          // lamps on the two north corners of every intersection
    const yy = h.r0 + h.lanes.length + 0.18;
    lampPost((v.c0 - 0.18) * T, YW(yy));
    lampPost((v.c0 + v.lanes.length + 0.18) * T, YW(yy));
  }
}

function paintLights() {
  for (const g of GLOWS) {
    circle(g.x, g.y, g.r, 'rgba(' + g.c + ',0.09)');
    circle(g.x, g.y, g.r * 0.62, 'rgba(' + g.c + ',0.15)');
    circle(g.x, g.y, g.r * 0.3, 'rgba(' + g.c + ',0.3)');
  }
}

function buildArt() {
  Object.assign(MINI, MINI_MORE);
  LIVE.length = 0; GLOWS.length = 0;
  lapCv = newCanvas(WCOLS * TN, LAP * TN);
  lightCv = newCanvas(WCOLS * TN, LAP * TN);
  campusCv = newCanvas(WCOLS * TN, CAMPUS * TN);
  campusMode = false;
  paintInto(lapCv, LAP - 1, () => {
    for (let r = LAP - 1; r >= 0; r--) for (let c = 0; c < WCOLS; c++) paintGround(c, r);
    for (let r = LAP - 1; r >= 0; r--) for (let c = 0; c < WCOLS; c++) { paintMarks(c, r); curbs(c, r); }
    paintBlocks();
    paintStreetDecor();
  });
  paintInto(lightCv, LAP - 1, paintLights);
  campusMode = true;
  paintInto(campusCv, -1, () => {
    for (let r = -1; r >= -CAMPUS; r--) for (let c = 0; c < WCOLS; c++) paintGround(c, r);
    for (let r = -1; r >= -CAMPUS; r--) for (let c = 0; c < WCOLS; c++) { paintMarks(c, r); curbs(c, r); }
    paintCampus();
  });
  campusMode = false;
}

// ---------------------------------------------------------------- downtown blocks: facades, landmarks, rooftops
// Each block holds 3 x 3 tiles of building. The camera looks north, so the south row shows a facade and the two
// rows behind it are rooftops. Landmarks sit on the block they really occupy (OpenStreetMap); everything else gets
// a generic storefront. Signs carry only local place names, never brands or school marks.
const MINI_MORE = { D: '65556', G: '34553', M: '57755', N: '65555', Y: '55222' };   // extra sign letters, merged into MINI when the art is built

function signW(word, Wd, j, c) {               // lettering centered across a facade Wd art pixels wide
  const len = word.length * 4 - 1;
  if (Wd < len) return;
  ctx.fillStyle = c;
  let i = Math.floor((Wd - len) / 2);
  for (const ch of word) { glyph(ch, i, j); i += 4; }
}
function roofW(Wd, rh, c) { px(0, 0, Wd, rh, c); px(0, 0, Wd, 1, 'rgba(255,255,255,0.16)'); px(0, rh - 1, Wd, 1, 'rgba(0,0,0,0.3)'); }
function columns(Wd, j0, j1, k, stone, mid) {
  const gap = (Wd - k * 2) / (k + 1);
  for (let i = 0; i < k; i++) { const x = Math.round(gap + i * (2 + gap)); px(x, j0, 2, j1 - j0, stone); px(x + 1, j0, 1, j1 - j0, mid); }
}
function chase(i, j, w, sp) {                  // marquee bulbs running along a row
  const ph = Math.floor(time * sp);
  for (let k = 0; k < w; k += 2) px(i + k, j, 1, 1, ((k >> 1) + ph) & 1 ? '#ffd23f' : '#c0702a');
}

// ---------------------------------------------------------------- landmark facades (Wd: width in art px)
function f40Watt(Wd) {                         // the club: black front, a bare lightbulb for a sign
  const n = TN, rh = tf(0.16), j = rh + 1, cx = Wd >> 1, on = Math.floor(time * 1.7) % 7 !== 0;
  roofW(Wd, rh, '#1f1a24');
  px(0, rh, Wd, n - rh, '#26222c');
  const g = on ? '#fff3b0' : '#6f6a55';
  px(cx - 2, j, 5, 1, g); px(cx - 3, j + 1, 7, 3, g); px(cx - 2, j + 4, 5, 1, g); px(cx - 1, j + 5, 3, 1, g);
  px(cx, j + 2, 1, 3, on ? '#ffb030' : '#4a4535');
  if (on) px(cx - 2, j + 1, 1, 2, '#ffffff');
  px(cx - 1, j + 6, 3, 2, '#9aa1a8'); px(cx - 1, j + 7, 3, 1, '#6e757c');
  door(3, j + 9, Wd - 6, '#3a2a40');
}

function fFlicker(Wd) {                        // the bar whose sign lives up to its name
  const n = TN, rh = tf(0.18), word = 'FLICKER';
  roofW(Wd, rh, '#2a2433');
  px(0, rh, Wd, n - rh, '#5a3a2e');
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  for (let j = rh + 2; j < n; j += 3) px(0, j, Wd, 1);
  px(1, rh + 1, Wd - 2, 7, '#1d1b2e');
  let i = (Wd - (word.length * 4 - 1)) >> 1;
  for (let k = 0; k < word.length; k++) {
    ctx.fillStyle = Math.floor(time * 6 + k * 3.7) % 13 ? '#7fe8ff' : '#2f4a55';
    glyph(word[k], i, rh + 2); i += 4;
  }
  const wj = rh + 9, half = Wd >> 1;
  win(2, wj, half - 4, n - wj - 1, '#ffb347');
  door(half - 1, wj - 1, 4, '#3a2028');
  win(half + 4, wj, Wd - half - 6, n - wj - 1, '#ffb347');
}

function fMorton(Wd) {                         // Morton Theatre, 1910: pale brick, arched windows, name band
  const n = TN, rh = tf(0.14), sj = n - 10;
  roofW(Wd, rh, '#4a3d44');
  px(0, rh, Wd, n - rh, '#c9a77a');
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  for (let j = rh + 3; j < n; j += 3) px(0, j, Wd, 1);
  px(0, rh, Wd, 2, '#efe2c4');
  for (let i = 2; i + 3 <= Wd - 1; i += 5) { px(i + 1, rh + 2, 1, 1, '#56719a'); px(i, rh + 3, 3, Math.max(1, sj - rh - 4), '#56719a'); }
  px(1, sj, Wd - 2, 7, '#7a1f2b');
  signW('MORTON', Wd, sj + 1, '#fff3d6');
  door(3, sj + 7, 4, '#5a2028'); door(Wd - 7, sj + 7, 4, '#5a2028');
}

function fChurch(Wd) {                         // First United Methodist: brick, one tall stained glass window
  const n = TN, rh = tf(0.12), cx = Wd >> 1;
  roofW(Wd, rh, '#6b6f78');
  px(0, rh, Wd, n - rh, '#9c4a3a');
  px(cx - 2, rh + 2, 4, 1, '#e8d9b8'); px(cx - 3, rh + 3, 6, n - rh - 9, '#e8d9b8');
  px(cx - 2, rh + 3, 4, n - rh - 9, '#7a5ab0'); px(cx - 1, rh + 4, 1, 2, '#ffd23f'); px(cx, rh + 6, 1, 2, '#e8364f');
  door(cx - 2, n - 5, 4, '#f2efe6');
}

function fGeorgia(Wd) {                        // Georgia Theatre: blade sign over the roofline, chasing marquee
  const n = TN, rh = tf(0.14), sj = n - 10, ph = Math.floor(time * 6);
  roofW(Wd, rh, '#3a2340');
  px(0, rh, Wd, n - rh, '#7a2a2a');
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  for (let j = rh + 2; j < n; j += 3) px(0, j, Wd, 1);
  for (let i = 6; i + 3 < Wd - 1; i += 5) px(i, rh + 2, 3, Math.max(1, sj - rh - 3), '#ffd36b');
  px(0, sj, Wd, 7, '#fff3d6');
  chase(0, sj, Wd, 6); chase(1, sj + 6, Wd - 1, 6);
  signW('THEATRE', Wd, sj + 1, '#c0282d');
  px(1, 0, 3, sj, '#1d1b2e');
  for (let j = 1; j < sj; j += 2) px(2, j, 1, 1, ((j >> 1) + ph) & 1 ? '#ffd23f' : '#ff6b2c');
  const dj = sj + 7;

function fCityHall(Wd) {

function civic(Wd, word, stone, mid, roofC, letter) {   // stone front, carved name, a row of columns, steps
  const n = TN, rh = tf(0.1), cj = rh + 9, sj = n - 2;

const fPostOffice = Wd => civic(Wd, 'POST OFFICE', '#d9d4c7', '#a9a397', '#5d6b75', '#3a3f4a');

function fHouse(Wd, k) {                       // west side: old houses with deep porches

// ---------------------------------------------------------------- special rooftops
function houseRoof(c0, r0, w, h, col) {
  ox = c0 * T; oy = Y(r0 + h - 1);
  const Wd = w * TN, Hd = h * TN, dark = shade(col, -0.3);
  px(0, 0, Wd, Hd, col);
  ctx.fillStyle = dark;
  for (let j = 2; j < Hd; j += 3) px(0, j, Wd, 1);
  px(0, (Hd >> 1) - 1, Wd, 2, shade(col, 0.25));
  px(0, 0, 1, Hd, dark); px(Wd - 1, 0, 1, Hd, dark); px(0, Hd - 1, Wd, 1, shade(col, -0.45));
  for (const i of [3, Wd - 7]) { px(i, (Hd >> 1) - 6, 4, 5, '#8a3b2c'); px(i, (Hd >> 1) - 6, 4, 1, '#5a2a22'); }
}

function roofBar(c0, r0, w, h) {               // Georgia Theatre's rooftop bar
  ox = c0 * T; oy = Y(r0 + h - 1);
  const Wd = w * TN, Hd = h * TN;
  px(2, 2, Wd - 4, Hd - 4, '#9a7350');
  ctx.fillStyle = '#7d5b3e';
  for (let j = 3; j < Hd - 2; j += 2) px(2, j, Wd - 4, 1);
  ctx.fillStyle = '#e6e2d8';
  px(2, 2, Wd - 4, 1); px(2, Hd - 3, Wd - 4, 1); px(2, 2, 1, Hd - 4); px(Wd - 3, 2, 1, Hd - 4);
  for (let k = 0; k < 4; k++) {
    const i = 5 + (k & 1) * (Wd >> 1), j = 5 + (k >> 1) * (Hd >> 1);
    px(i - 2, j - 2, 6, 5, k & 1 ? '#d62839' : '#2a9d8f'); px(i, j, 2, 1, '#f7f3e8');
  }
  for (let i = 3; i < Wd - 3; i += 3) {
    const j = (Hd >> 1) + ((i / 3) & 1);
    px(i, j, 1, 1, '#ffe9a8');
    glow(ox + i / RS, oy + j / RS, T * 0.3, '255,220,150');
  }
}

function roofDeck(c0, r0, w, h) {              // top level of the deck, cars nosed into stalls
  ox = c0 * T; oy = Y(r0 + h - 1);
  const Wd = w * TN, Hd = h * TN;
  px(0, 0, Wd, Hd, '#8d939a');
  px(0, 0, Wd, 1, '#b5bbc2'); px(0, 0, 1, Hd, '#b5bbc2'); px(0, Hd - 1, Wd, 1, '#5f656c'); px(Wd - 1, 0, 1, Hd, '#5f656c');
  for (let k = 0, j = 2; j + 6 < Hd; k++, j += TN) {
    ctx.fillStyle = '#e6e4da';
    for (let i = 2; i < Wd - 2; i += 5) px(i, j, 1, 6);
    for (let i = 3; i + 3 < Wd - 2; i += 5) if (hash(i, k, 91) < 0.5) {
      const col = CAR_COLORS[Math.floor(hash(k, i, 92) * CAR_COLORS.length)];
      px(i, j, 3, 6, col); px(i, j + 2, 3, 2, shade(col, -0.35));
    }
  }
  px(Wd - 8, Hd - 9, 7, 8, '#6d737a'); px(Wd - 7, Hd - 8, 5, 2, '#3d434b');
}

function churchRoof(c, r) {                    // First UMC: slate roof and a white steeple
  ox = c * T; oy = Y(r + 1);
  const n = TN, Hd = 2 * n, cx = n >> 1;
  px(0, 0, n, Hd, '#6b6f78');
  ctx.fillStyle = '#585c64';
  for (let j = 2; j < Hd; j += 3) px(0, j, n, 1);
  px(cx - 1, 0, 2, Hd, '#858a94');
  px(cx - 4, Hd - 9, 8, 9, '#f2efe6'); px(cx + 3, Hd - 9, 1, 9, '#c9c4b8');
  px(cx - 2, Hd - 7, 4, 3, '#3d4a5c');
  px(cx - 3, Hd - 14, 6, 5, '#f2efe6'); px(cx + 2, Hd - 14, 1, 5, '#c9c4b8'); px(cx - 1, Hd - 13, 2, 3, '#3d4a5c');
  const sp = Hd - 15;
  for (let k = 0; k < sp; k++) { const w = Math.max(1, Math.round(5 * (1 - k / sp))); px(cx - (w >> 1), Hd - 15 - k, w, 1, k < 2 ? '#d8d3c6' : '#f2efe6'); }
}

function domeAt(c, r) {                        // City Hall's clock tower
  ox = c * T; oy = Y(r + 1);
  const cx = Math.floor(1.5 * TN), by = 2 * TN;
  px(cx - 7, by - 3, 14, 3, '#cdbf9c');
  px(cx - 6, by - 11, 12, 8, '#efe6cf'); px(cx + 4, by - 11, 2, 8, '#cdbf9c');
  px(cx - 3, by - 10, 6, 6, '#1d1b2e'); px(cx - 2, by - 9, 4, 4, '#fdf6d8');
  px(cx, by - 9, 1, 2, '#1d1b2e'); px(cx, by - 7, 2, 1, '#1d1b2e');
  px(cx - 6, by - 12, 12, 1, '#ffffff');
  px(cx - 5, by - 15, 10, 3, '#c9ccd1'); px(cx - 4, by - 17, 8, 2, '#c9ccd1'); px(cx - 2, by - 18, 4, 1, '#c9ccd1');
  px(cx - 4, by - 15, 2, 2, '#eef0f3');
  px(cx, by - 21, 1, 3, '#c9a227');
  glow(ox + cx / RS, oy + (by - 7) / RS, T * 0.8, '255,240,200');
}

function arenaRoof(c0, r0, w, h) {
  roofArea(c0, r0, w, h, '#5d5864');
  const cx = (c0 + w / 2) * T, cy = Y(r0 + h - 1) + h * T / 2;
  ellipse(cx, cy, w * T * 0.47, h * T * 0.45, '#b9bec4');
  ellipse(cx, cy, w * T * 0.35, h * T * 0.33, '#cfd4d9');
  ellipse(cx, cy, w * T * 0.18, h * T * 0.17, '#e3e7eb');
}

function smokestack(c, r, hgt) {               // foundry chimney rising off the roof
  ox = c * T; oy = Y(r);
  const cx = TN >> 1, by = TN;
  px(cx - 3, by - hgt, 6, hgt, '#9c3f2f'); px(cx - 3, by - hgt, 2, hgt, '#b5523b');
  px(cx - 4, by - hgt, 8, 2, '#5a2a22'); px(cx - 2, by - hgt, 4, 1, '#1d1b2e');
}

function marker(c, r) {                        // a historical marker on its post, tucked into the corner
  ox = c * T; oy = Y(r);
  const n = TN;
  px(n - 4, n - 7, 1, 6, '#3d3f4b');
  px(n - 7, n - 12, 7, 5, '#c9a227'); px(n - 6, n - 11, 5, 3, '#1f4d3a');
  ctx.fillStyle = '#e9d58a';
  px(n - 5, n - 10, 3, 1);
}

// ---------------------------------------------------------------- what goes where

  [bShop, bCafe, bBooks, bRecords, bDiner, bShop, bBrick],   // Broad St, facing campus
  [bBar, bBar, bBrick, bShop, bRecords, bCafe],               // Clayton St

  [bBrick, bShop, bBrick, bBooks],                            // Dougherty St

const LIVE_FN = new Set([bDiner, bBar, bTheater]);
const MARKS = [   // c, r: west column and lap row of the facade; w tiles wide (h rows tall)
  { c: 6, r: 19, w: 1, f: f40Watt, live: 1, glow: [[0.5, 0.4, 1.3, '255,240,170']] },

  { c: 34, r: 19, w: 3, f: fCourthouse },

];
const ROOFS = {   // key: block row * 5 + block; called with the south-west roof tile
  6: (c, r) => { roofArea(c, r, 3, 2); roofBar(c + 1, r, 2, 2); },
  7: (c, r) => roofDeck(c, r, 3, 2),
  11: (c, r) => { roofArea(c, r, 2, 2); churchRoof(c + 2, r); },
  12: (c, r) => { roofArea(c, r, 3, 2, '#5d6870'); domeAt(c, r); },
  13: (c, r) => roofArea(c, r, 3, 2, '#7a7f86'),
  14: (c, r) => roofArea(c, r, 3, 2, '#68857a'),
  18: (c, r) => roofArea(c, r + 1, 3, 1, '#77727f'),
  24: (c, r) => houseRoof(c, r, 3, 2, '#4a5058'),
};
const markAt = (c, r) => MARKS.some(m => r >= m.r && r < m.r + (m.h || 1) && c >= m.c && c < m.c + m.w);

function genericFacade(c, r, br) {
  const mix = ROW_MIX[br], f = mix[Math.floor(hash(c, r, 54) * mix.length)];
  const a = hash(c, r, 51), b = hash(c, r, 52), d = hash(c, r, 53);
  const draw = () => { f(a, b, d); px(0, 0, 1, TN, 'rgba(0,0,0,0.28)'); };
  at(c, r); draw();
  if (LIVE_FN.has(f)) LIVE.push({ c, r, w: 1, draw });
  if (f === bBar || f === bDiner || f === bCafe) glow((c + 0.5) * T, Y(r) + T * 0.7, T * 0.9, f === bBar ? (b < 0.5 ? '255,79,216' : '79,216,255') : '255,200,130');
}

function paintFacade(m) {
  const h = m.h || 1, Wd = m.w * TN, Hd = h * TN;
  const draw = () => { m.f(Wd, Hd); px(0, 0, 1, Hd, 'rgba(0,0,0,0.28)'); };
  at(m.c, m.r + h - 1); draw();
  if (m.live) LIVE.push({ c: m.c, r: m.r + h - 1, w: m.w, draw });
  if (m.glow) for (const [dx, dy, rr, col] of m.glow) glow((m.c + dx) * T, Y(m.r) + dy * T, rr * T, col);
}

function paintBlocks() {
  for (let br = 0; br < 5; br++) {
    const r1 = BLOCK_R[br] + 1;
    for (let b = 0; b < 5; b++) {
      const c1 = BLOCK_C[b] + 1, spec = ROOFS[br * 5 + b];
      if (spec) spec(c1, r1 + 1); else roofArea(c1, r1 + 1, 3, 2);
      for (let c = c1; c < c1 + 3; c++) if (!markAt(c, r1)) genericFacade(c, r1, br);
    }
    houseRoof(0, r1 + 1, 2, 2, ['#5a4a42', '#4a5058', '#6b4f3a', '#556052', '#5a4a42'][br]);   // west: houses
    at(0, r1); fHouse(2 * TN, br);
    if (br === 2) arenaRoof(43, r1 + 1, 2, 2);                                              // east: Classic Center, foundry
    else roofArea(43, r1 + 1, 2, 2, br === 1 ? '#8d939a' : br >= 3 ? '#5a4a48' : undefined);
    if (br === 3) smokestack(44, r1 + 2, Math.round(TN * 1.6));
  }
  for (const m of MARKS) paintFacade(m);
  marker(9, 15);                                                                           // Hot Corner
}

// ---------------------------------------------------------------- North Campus, painted once into its own canvas
// Coming up the main walk: Old College at the back, the Chapel and its bell, Holmes-Hunter, the two literary
// society halls, the fountain on Herty Field, then the iron fence and the Arch on Broad St. No school marks:
// the Arch is bare iron and the halls carry no names.
const CLIVE = [];   // animated campus pieces: { c, r: north row (its tile top is the origin), draw }

function brickWall(i0, j0, w, h, base) {        // running bond
  px(i0, j0, w, h, base);
  ctx.fillStyle = shade(base, -0.16);
  for (let j = j0 + 2; j < j0 + h; j += 3) px(i0, j, w, 1);
  ctx.fillStyle = shade(base, -0.24);
  for (let j = j0; j < j0 + h; j += 3) for (let i = i0 + ((j / 3) & 1 ? 1 : 3); i < i0 + w; i += 4) px(i, j, 1, 2);
}
function sash(i, j, w, h) {                      // white-framed sash window
  px(i, j, w, h, '#f4f1ea');
  px(i + 1, j + 1, w - 2, h - 2, '#2a3340');
  if (w > 4) px(i + (w >> 1), j + 1, 1, h - 2, '#f4f1ea');
  if (h > 4) px(i + 1, j + (h >> 1), w - 2, 1, '#f4f1ea');
  px(i + 1, j + 1, 1, 1, '#6d8399');
}
function pediment(i0, w, h, c, edge) {           // stepped gable sitting on j = 0, rising h art px into the roof row
  for (let k = 1; k <= h; k++) {
    const inset = Math.round(k * w / (2 * (h + 1)));
    px(i0 + inset, -k, w - 2 * inset, 1, k === h ? edge : c);
    px(i0 + inset, -k, 1, 1, edge); px(i0 + w - inset - 1, -k, 1, 1, edge);
  }
  px(i0, -1, w, 1, edge);
}
function templeFront(Wd, k, wall, stone, mid) {  // entablature, a row of columns, a shadowed porch, steps
  const n = TN, ej = tf(0.16), sj = n - tf(0.14), dw = Math.max(3, tf(0.22));
  px(0, ej, Wd, sj - ej, wall);
  px((Wd - dw) >> 1, ej + tf(0.2), dw, sj - ej - tf(0.2), '#3a2a22');
  columns(Wd, ej, sj, k, stone, mid);
  px(0, 0, Wd, ej, stone); px(0, 0, Wd, 1, '#ffffff'); px(0, ej - 1, Wd, 1, mid);
  px(0, sj, Wd, n - sj, '#cfc9bb'); px(0, sj, Wd, 1, '#e8e3d6'); px(0, n - 1, Wd, 1, '#a9a397');
}
function hall(Wd, wall, brick, portico) {        // two floors of sash windows, a fanlight door, maybe a portico
  const n = TN, cj = tf(0.12), w1 = Math.max(3, tf(0.22)), h1 = Math.max(3, tf(0.24)), cx = Wd >> 1;
  if (brick) brickWall(0, 0, Wd, n, wall);
  else { px(0, 0, Wd, n, wall); ctx.fillStyle = shade(wall, -0.07); for (let j = 3; j < n; j += 4) px(0, j, Wd, 1); }
  px(0, 0, Wd, cj, '#f4f1ea'); px(0, cj - 1, Wd, 1, '#c9c3b6');
  const k = Math.max(2, Math.floor(Wd / (w1 + 3))), gap = (Wd - k * w1) / (k + 1);
  for (let i = 0; i < k; i++) {
    const x = Math.round(gap + i * (w1 + gap));
    sash(x, cj + 2, w1, h1);
    if (Math.abs(x + w1 / 2 - cx) > w1 + 1) sash(x, cj + h1 + 4, w1, h1);
  }
  const dw = Math.max(3, tf(0.26)), dj = n - tf(0.42);
  px(cx - (dw >> 1) - 1, dj - 2, dw + 2, n - dj + 2, '#f4f1ea');
  px(cx - (dw >> 1), dj - 1, dw, 1, '#9fb6c8');
  px(cx - (dw >> 1), dj, dw, n - dj, '#2f3a2c');
  px(0, n - 1, Wd, 1, shade(wall, -0.35));
  if (portico) {
    const pw = Math.max(4 * 3 + 2, Math.round(Wd * 0.36)), p0 = (Wd - pw) >> 1, keep = ox;
    ox += p0 / RS;
    templeFront(pw, portico, '#5a5248', '#f4f1ea', '#c9c3b6');
    pediment(0, pw, tf(0.34), '#f4f1ea', '#c9c3b6');
    ox = keep;
  }
}

// ---------------------------------------------------------------- roofs behind the facades
function roofNS(c0, r0, w, h, col) {             // ridge runs north-south: east slope in shade, standing seams
  ox = c0 * T; oy = Y(r0 + h - 1);
  const Wd = w * TN, Hd = h * TN, half = Wd >> 1;
  px(0, 0, half, Hd, col); px(half, 0, Wd - half, Hd, shade(col, -0.22));
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  for (let i = 2; i < Wd; i += 3) if (Math.abs(i - half) > 1) px(i, 0, 1, Hd);
  px(half - 1, 0, 2, Hd, shade(col, 0.22));
  px(0, 0, Wd, 1, shade(col, -0.4)); px(0, 0, 1, Hd, shade(col, -0.3)); px(Wd - 1, 0, 1, Hd, shade(col, -0.45));
}
function roofEW(c0, r0, w, h, col, chim) {       // ridge runs east-west: the south slope catches the sun
  ox = c0 * T; oy = Y(r0 + h - 1);
  const Wd = w * TN, Hd = h * TN, mid = Hd >> 1;
  px(0, 0, Wd, mid, shade(col, -0.22)); px(0, mid, Wd, Hd - mid, col);
  ctx.fillStyle = 'rgba(0,0,0,0.13)';
  for (let j = 2; j < Hd; j += 3) if (Math.abs(j - mid) > 1) px(0, j, Wd, 1);
  px(0, mid - 1, Wd, 2, shade(col, 0.2));
  px(0, 0, Wd, 1, shade(col, -0.4)); px(0, 0, 1, Hd, shade(col, -0.3)); px(Wd - 1, 0, 1, Hd, shade(col, -0.45));
  if (chim) for (const i of [3, Wd - 7]) { px(i, mid - 5, 4, 6, chim); px(i, mid - 5, 4, 1, shade(chim, -0.35)); px(i + 3, mid - 4, 1, 5, shade(chim, -0.25)); }
}

// ---------------------------------------------------------------- the pieces
function bellTower(c, r) {                       // the Chapel bell in its own little white tower
  at(c, r);
  const n = TN, cx = n >> 1, top = -tf(0.7), lj = top + 5, bj = top + 6;
  px(2, n - 2, n - 2, 2, 'rgba(0,0,0,0.22)');
  for (const i of [2, n - 4]) { px(i, lj, 2, n - lj - 1, '#f4f1ea'); px(i + 1, lj, 1, n - lj - 1, '#c9c3b6'); }
  px(2, n - 6, n - 4, 1, '#c9c3b6'); px(2, lj, n - 4, 1, '#c9c3b6');
  for (let k = 0; k < 5; k++) { const ins = 4 - k; px(1 + ins, top + k, n - 2 - 2 * ins, 1, k === 4 ? '#3f4850' : '#5d6870'); }
  px(cx, top - 2, 1, 2, '#c9a227');
  px(cx - 1, bj, 3, 1, '#8a6128'); px(cx - 2, bj + 1, 5, 2, '#b0813a'); px(cx - 3, bj + 3, 7, 1, '#8a6128');
  px(cx - 1, bj + 1, 1, 1, '#e0b868'); px(cx, bj + 4, 1, 1, '#3a2a18');
  px(cx, bj + 5, 1, n - bj - 7, '#d9c9a5');
}

function fountain(c, r) {                        // the fountain on Herty Field (2 x 2, r is its south row)
  ox = c * T; oy = Y(r + 1);
  const cx = ox + T, cy = oy + T;
  ellipse(cx, cy, T * 0.98, T * 0.9, '#d8ceb4');
  ellipse(cx + T * 0.06, cy + T * 0.08, T * 0.88, T * 0.74, 'rgba(0,0,0,0.2)');
  ellipse(cx, cy, T * 0.86, T * 0.72, '#8f897d');
  ellipse(cx, cy, T * 0.82, T * 0.68, '#c9c3b6');
  ellipse(cx, cy, T * 0.72, T * 0.58, '#3f86b8');
  CLIVE.push({ c, r: r + 1, draw: fountainWater });
}
function fountainWater() {                       // per frame: ripples running out, the jet and its spray
  const cx = ox + T, cy = oy + T, q = 1 / RS;
  ellipse(cx, cy, T * 0.72, T * 0.58, '#3f86b8');
  for (let k = 0; k < 2; k++) {
    const ph = (time * 0.55 + k * 0.5) % 1, rx = T * (0.26 + ph * 0.42);
    ellipse(cx, cy, rx, rx * 0.8, ph < 0.75 ? '#62aedc' : '#4f9acb');
    ellipse(cx, cy, rx - q, rx * 0.8 - q, '#3f86b8');
  }
  ellipse(cx, cy, T * 0.2, T * 0.16, '#8f897d');
  ellipse(cx, cy - T * 0.06, T * 0.17, T * 0.13, '#c9c3b6');
  ellipse(cx, cy - T * 0.2, T * 0.26, T * 0.1, '#b9b3a6');
  ellipse(cx, cy - T * 0.21, T * 0.2, T * 0.07, '#62aedc');
  ctx.fillStyle = '#d9f1ff';
  const jh = T * (0.42 + 0.04 * Math.sin(time * 9));
  fr(cx - q, cy - T * 0.2 - jh, 2 * q, jh);
  for (let k = 0; k < 6; k++) {
    const ph = (time * 1.4 + k / 6) % 1, a = (k / 6) * Math.PI * 2 + 0.4;
    const d = T * 0.3 * ph, x = cx + Math.cos(a) * d, y = cy - T * 0.2 - jh + T * 0.9 * ph * ph - T * 0.15 * ph + Math.sin(a) * d * 0.4;
    ctx.fillStyle = ph < 0.6 ? '#ffffff' : '#b6e2ff';
    fr(x, y, q, q);
  }
}

function ironFence(c, r) {                       // the old iron fence along Broad St
  at(c, r);
  const n = TN, t = tf(0.24), b = n - 3;
  px(0, b, n, 3, '#8f897d'); px(0, b, n, 1, '#b9b3a6');
  px(0, t + 1, n, 1, '#24262c'); px(0, b - 2, n, 1, '#24262c');
  for (let i = 1; i < n; i += 3) { px(i, t, 1, b - t, '#2c2f36'); px(i, t - 1, 1, 1, '#555b66'); }
  if (c % 7 === 3) { px((n >> 1) - 2, t - 3, 4, b - t + 3, '#9c968a'); px((n >> 1) - 2, t - 3, 4, 1, '#c9c3b6'); px((n >> 1) - 1, t - 4, 2, 1, '#2c2f36'); }
}
function gatePiers(c, r) {                       // an open gate: granite piers, iron lanterns on top
  at(c, r);
  const n = TN, t = tf(0.12);
  for (const i of [0, n - 3]) {
    px(i, t, 3, n - t, '#a9a397'); px(i, t, 3, 1, '#d8d2c4'); px(i + 2, t + 1, 1, n - t - 1, '#8a8478');
    px(i, t - 3, 3, 3, '#24262c'); px(i + 1, t - 2, 1, 1, '#ffe7a6');
  }
}

function theArch() {                             // cast iron, three columns, an arched crest; no lettering
  ox = 24 * T; oy = Y(-2);
  const Wd = 2 * TN, n = TN, iron = '#2b2e35', hi = '#4d525c', lo = '#1a1c21';
  const base = n - 3, top = -tf(0.8), band = top + tf(0.32), lint = band + 3;
  px(2, n - 1, Wd - 2, 1, 'rgba(0,0,0,0.25)');
  for (const x of [2, (Wd >> 1) - 1, Wd - 5]) {
    px(x - 1, base, 5, 3, '#9c968a'); px(x - 1, base, 5, 1, '#c9c3b6');
    px(x, lint, 3, base - lint, iron); px(x, lint, 1, base - lint, hi); px(x + 2, lint, 1, base - lint, lo);
    px(x - 1, lint, 5, 1, hi); px(x - 1, base - 1, 5, 1, lo);
  }
  px(0, band, Wd, 3, iron); px(0, band, Wd, 1, hi); px(0, band + 2, Wd, 1, lo);
  const ah = band - top;
  for (let i = 1; i < Wd - 1; i++) {             // the crest: a shallow arc over an iron lattice
    const u = (i + 0.5) / Wd * 2 - 1, hgt = Math.round(ah * Math.sqrt(Math.max(0, 1 - u * u)));
    for (let j = band - hgt + 1; j < band; j++) if ((i + j) % 2 === 0) px(i, j, 1, 1, iron);
    px(i, band - hgt, 1, 1, hgt > 0 ? hi : iron); px(i, band - hgt + 1, 1, 1, iron);
  }
  px(0, band - 2, 2, 2, iron); px(Wd - 2, band - 2, 2, 2, iron);
  px((Wd >> 1) - 1, top - 2, 2, 2, '#4d525c');
}

function magnolia(cx, cy) {                      // southern magnolia: dark, glossy, a few white blooms
  ellipse(cx + T * 0.07, cy + T * 0.14, T * 0.34, T * 0.18, 'rgba(0,0,0,0.25)');
  ctx.fillStyle = '#4a3a2e'; fr(cx - T * 0.04, cy, T * 0.08, T * 0.2);
  ellipse(cx, cy - T * 0.02, T * 0.38, T * 0.2, '#123020');
  ellipse(cx, cy - T * 0.03, T * 0.36, T * 0.18, '#1f5a32');
  ellipse(cx, cy - T * 0.2, T * 0.29, T * 0.16, '#24683a');
  ellipse(cx, cy - T * 0.35, T * 0.19, T * 0.12, '#2e7a45');
  ellipse(cx, cy - T * 0.46, T * 0.09, T * 0.07, '#3a8d52');
  ctx.fillStyle = '#fbf7ea';
  const q = 1 / RS;
  for (let k = 0; k < 4; k++) fr(cx + (hash(cx, cy, k) - 0.5) * T * 0.5, cy - T * (0.06 + hash(cy, cx, k) * 0.36), q, q);
}

function campusTree(c, r) {
  const x = (c + 0.5) * T, y = Y(r) + T * 0.55;
  if (hash(c, r, 77) < 0.3) magnolia(x, y); else drawTree(x, y);
}

function paintCampusBldg(b) {
  const Wd = b.w * TN, rr = b.r + 1, rh = b.h - 1;
  if (b.id === 'chapel') {                       // the Chapel, 1832: six columns and a big pediment
    roofNS(b.c, rr, b.w, rh, '#8e959c');
    at(b.c, b.r); templeFront(Wd, 6, '#5a5248', '#f6f3ec', '#cfc8b8');
    pediment(0, Wd, tf(0.6), '#f6f3ec', '#bdb6a6');
    px((Wd >> 1) - 2, -tf(0.3), 4, 3, '#2a3340'); px((Wd >> 1) - 1, -tf(0.3), 2, 1, '#6d8399');
  } else if (b.id === 'bell') bellTower(b.c, b.r);
  else if (b.id === 'oldcollege') {              // Old College, 1806: plain red brick, four chimneys
    roofEW(b.c, rr, b.w, rh, '#5d5864', '#8a3b2c');
    ox = b.c * T; oy = Y(rr + rh - 1);
    const mid = (rh * TN) >> 1;
    for (const i of [Math.round(Wd * 0.33), Math.round(Wd * 0.62)]) { px(i, mid - 5, 4, 6, '#8a3b2c'); px(i, mid - 5, 4, 1, '#5a2a22'); }
    at(b.c, b.r); hall(Wd, '#a8473a', true, 0);
  } else if (b.id === 'holmes') {                // Holmes-Hunter: cream stucco, a columned center
    roofEW(b.c, rr, b.w, rh, '#6f7a7e');
    at(b.c, b.r); hall(Wd, '#eadfc4', false, 4);
  } else if (b.id === 'demos') {                 // Demosthenian Hall: small, peach stucco, a fanlight door
    roofEW(b.c, rr, b.w, rh, '#5d5864', '#9a5a44');
    at(b.c, b.r); hall(Wd, '#e7b08c', false, 0);
  } else if (b.id === 'phikappa') {              // Phi Kappa Hall: a small temple across the walk
    roofNS(b.c, rr, b.w, rh, '#7d848b');
    at(b.c, b.r); templeFront(Wd, 4, '#5a5248', '#f2ead6', '#c9bfa5');
    pediment(0, Wd, tf(0.42), '#f2ead6', '#b5aa90');
  } else if (b.id === 'fountain') fountain(b.c, b.r);
  else {                                         // the other halls: brick with white trim
    const v = Math.floor(hash(b.c, b.r, 5) * 3);
    roofEW(b.c, rr, b.w, rh, ['#5d5864', '#4a5058', '#5a4a48'][v], '#8a3b2c');
    at(b.c, b.r); hall(Wd, ['#a8473a', '#b5523b', '#9c4535'][v], true, b.w >= 4 ? 4 : 0);
  }
}

function paintCampus() {
  CLIVE.length = 0;
  for (let c = 0; c < WCOLS; c++) {
    const k = tileKind(c, -2);
    if (k === 'fence') ironFence(c, -2); else if (k === 'gate') gatePiers(c, -2);
  }
  theArch();
  for (const x of [24.14, 25.86]) for (const r of [-4, -7]) lampPost(x * T, YW(r + 0.2));
  marker(22, -5);
  for (let r = -3; r >= -CAMPUS; r--) {          // north to south so nearer things overlap what is behind
    for (const b of CAMPUS_BLDGS) if (b.r + b.h - 1 === r) paintCampusBldg(b);
    for (let c = 0; c < WCOLS; c++) if (tileKind(c, r) === 'tree') campusTree(c, r);
  }
}

// 3x5 lettering for storefront signs. Generic words only: no names, no brands.
const MINI = { A: '25755', B: '65656', C: '34443', E: '74647', F: '74644', H: '55755', I: '72227', K: '55655',
  L: '44447', O: '25552', P: '65644', R: '65655', S: '34216', T: '72222', U: '55557', V: '55552', W: '55775', X: '55255' };
const tf = v => Math.round(v * TN);   // fraction of a tile -> whole art pixels

function glyph(ch, i, j) {
  const g = MINI[ch];
  if (!g) return;
  for (let r = 0; r < 5; r++) for (let b = 0; b < 3; b++) if (+g[r] & (4 >> b)) px(i + b, j + r, 1, 1);
}
function sign(word, short, j, c) {     // centered sign text; tiny tiles get the shorter word
  const w = TN >= word.length * 4 - 1 ? word : short;
  if (TN < w.length * 4 - 1) return;
  ctx.fillStyle = c;
  let i = Math.floor((TN - (w.length * 4 - 1)) / 2);
  for (const ch of w) { glyph(ch, i, j); i += 4; }
}
function roof(rh, c) {
  px(0, 0, TN, rh, c);
  px(0, 0, TN, 1, 'rgba(255,255,255,0.16)');
  px(0, rh - 1, TN, 1, 'rgba(0,0,0,0.3)');
}
function win(i, j, w, h, glass) {
  px(i, j, w, h, '#1d1b2e');
  px(i + 1, j + 1, w - 2, h - 2, glass);
  if (w > 4 && h > 3) px(i + 1, j + 1, 1, h - 2, 'rgba(255,255,255,0.45)');
}
function door(i, j, w, c) {
  px(i, j, w, TN - j, '#1d1b2e');
  px(i + 1, j + 1, w - 2, TN - j - 1, c);
  px(i + 1, j + ((TN - j) >> 1), 1, 1, '#ffd23f');
}

// awning shop
function bShop(a, b, d) {
  const n = TN, wi = Math.floor(a * WALLS.length), aw = AWNINGS[Math.floor(b * AWNINGS.length)], rh = tf(0.34);
  roof(rh, WALL_ROOF[wi]);
  if (d < 0.45) { px(tf(0.5), tf(0.08), tf(0.3), tf(0.16), '#a3a9af'); px(tf(0.5), tf(0.08) + tf(0.16) - 1, tf(0.3), 1, '#6e757c'); }
  px(0, rh, n, n - rh, WALLS[wi]);
  const ah = Math.max(2, tf(0.14));
  for (let i = 0; i < n; i += 2) { const k = (i >> 1) & 1; px(i, rh, Math.min(2, n - i), ah + 1 - k, aw[k]); }
  const wy = rh + ah + 2;
  win(1, wy, tf(0.56), n - wy - 1, d > 0.5 ? '#9fd0e0' : '#ffe2a8');
  door(tf(0.66), wy - 1, tf(0.26), shade(WALLS[wi], -0.5));
}

// old brick block: stone cornice and two floors of arched windows
function bBrick(a, b, d) {
  const n = TN, wall = ['#9c3f2f', '#b5523b', '#7d3b30', '#a8603f'][Math.floor(a * 4)], rh = tf(0.16);
  roof(rh, '#4a3d44');
  px(0, rh, n, n - rh, wall);
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  for (let j = rh + 4; j < n; j += 3) px(0, j, n, 1);
  px(0, rh, n, 2, '#e8d9b8');
  ctx.fillStyle = '#b9a57e';
  for (let i = 1; i < n; i += 2) px(i, rh + 2, 1, 1);
  const cols = n >= 15 ? 3 : 2, gap = Math.floor((n - cols * 3) / (cols + 1));
  const x0 = Math.floor((n - (cols * 3 + (cols - 1) * gap)) / 2), fh = Math.round((n - rh - 4) / 2), wh = Math.max(3, fh - 2);
  for (let fl = 0; fl < 2; fl++) {
    const j = rh + 4 + fl * fh;
    for (let k = 0; k < cols; k++) {
      const i = x0 + k * (3 + gap), g = hash(Math.floor(d * 9999), k, fl) < 0.45 ? '#ffd36b' : '#56719a';
      px(i + 1, j, 1, 1, g);
      px(i, j + 1, 3, wh - 1, g);
      px(i, j + 1, 1, wh - 1, 'rgba(0,0,0,0.25)');
      px(i, j + wh, 3, 1, '#e8d9b8');
    }
  }
}

// old movie house: marquee with chasing bulbs
function bTheater(a, b, d) {
  const n = TN, rh = tf(0.16), j0 = rh + 1, chase = Math.floor(time * 5);
  roof(rh, '#3a2340');
  px(0, rh, n, n - rh, '#6e2a3c');
  px(0, j0, n, 7, '#fff3d6');
  for (let i = 0; i < n; i += 2) {
    const c = ((i >> 1) + chase) & 1 ? '#ffd23f' : '#c0702a';
    px(i, j0, 1, 1, c); px(i, j0 + 6, 1, 1, c);
  }
  sign('SHOW', 'TIX', j0 + 1, '#c0282d');
  const dj = j0 + 8, dx = tf(0.28);
  px(dx, dj, n - 2 * dx, n - dj, '#1d1b2e');
  px(dx + 1, dj + 1, n - 2 * dx - 2, n - dj - 1, '#e8b44a');
  px(n >> 1, dj + 1, 1, n - dj - 1, '#1d1b2e');
  for (const i of [1, n - 4]) { px(i, dj, 3, n - dj - 1, '#1d1b2e'); px(i + 1, dj + 1, 1, n - dj - 3, b < 0.5 ? '#4cc3e0' : '#ffd23f'); }
}

// chrome diner: neon trim, window band, checkerboard skirt
function bDiner(a, b, d) {
  const n = TN, rh = tf(0.18), flick = Math.floor(time * 3 + d * 50) % 11 === 0;
  const neon = flick ? '#5a2a4a' : b < 0.5 ? '#ff5fa2' : '#4ff0d0';
  roof(rh, '#5d6b75');
  px(0, rh, n, n - rh, '#cfdde3');
  px(0, rh, n, 1, neon);
  px(0, rh + 1, n, 7, '#1d1b2e');
  sign('EAT', 'EAT', rh + 2, neon);
  const wj = rh + 8;
  px(0, wj, n, 2, '#9fe1f0');
  ctx.fillStyle = '#2b6f8a';
  for (let i = 0; i < n; i += 4) px(i, wj, 1, 2);
  px(0, wj + 2, n, 1, '#ffffff');
  for (let j = wj + 3; j < n; j++) {
    px(0, j, n, 1, '#f4f1ea');
    ctx.fillStyle = '#1d1b2e';
    for (let i = j & 1; i < n; i += 2) px(i, j, 1, 1);
  }
}

// music bar: dark brick, flickering neon word, warm window
function bBar(a, b, d) {
  const n = TN, rh = tf(0.2), on = Math.floor(time * 2.5 + d * 40) % 9 !== 0;
  const neon = b < 0.5 ? '#ff4fd8' : '#4fd8ff', glow = b < 0.5 ? '#7a2a6a' : '#24607a';
  roof(rh, '#2a2433');
  px(0, rh, n, n - rh, '#3b2f45');
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  for (let j = rh + 2; j < n; j += 3) px(0, j, n, 1);
  const word = d < 0.5 ? 'LIVE' : 'BAR';
  if (on) sign(word, 'BAR', rh + 2, glow);
  sign(word, 'BAR', rh + 1, on ? neon : '#55405e');
  const wj = rh + 8;
  win(1, wj, tf(0.5), n - wj - 1, on ? '#ffb347' : '#c98a3a');
  door(tf(0.68), wj - 1, tf(0.26), '#5a2028');
  px(tf(0.68) + 1, wj - 2, 2, 1, '#ff2d3d');
}

// civic hall: copper roof, pediment, columns, steps
function bCivic(a, b, d) {
  const n = TN, stone = '#e9dfc6', mid = '#cbbd98', rh = tf(0.1), ph = Math.max(3, tf(0.22));
  roof(rh + ph, '#5f8f7e');
  for (let k = 0; k < ph; k++) { const w = Math.round(((k + 1) / ph) * n); px((n - w) >> 1, rh + k, w, 1, stone); }
  const ej = rh + ph, cj = ej + 3, sj = n - 2;
  px(0, ej, n, 2, stone);
  px(0, ej + 2, n, 1, mid);
  px(0, cj, n, sj - cj, '#4a4038');
  const nc = n >= 15 ? 4 : 3, gap = (n - nc * 2) / (nc + 1);
  for (let k = 0; k < nc; k++) {
    const i = Math.round(gap + k * (2 + gap));
    px(i, cj, 2, sj - cj, stone);
    px(i + 1, cj, 1, sj - cj, mid);
  }
  px(0, sj, n, 1, '#d8ccb0');
  px(0, sj + 1, n, 1, '#b3a78c');
}

// parking deck: open levels with parked cars, blue P sign
function bDeck(a, b, d) {
  const n = TN, rh = tf(0.24), s = Math.floor(d * 9999);
  roof(rh, '#7d838a');
  ctx.fillStyle = '#e6e4da';
  for (let i = 2; i < n; i += 4) px(i, 1, 1, rh - 2);
  if (b < 0.6) px(4, 2, 3, Math.max(1, rh - 4), CAR_COLORS[Math.floor(a * CAR_COLORS.length)]);
  px(0, rh, n, n - rh, '#a7adb3');
  for (let k = 0, j = rh + 1; j + 1 < n; k++, j += 4) {
    px(0, j, n, 2, '#2a2d33');
    for (let i = 1; i < n - 3; i += 4) if (hash(s, i, k) < 0.55) px(i, j + 1, 3, 1, CAR_COLORS[Math.floor(hash(i, k, s) * CAR_COLORS.length)]);
  }
  const pi = n - 6;
  px(pi, rh + 1, 5, 7, '#2a6fdb');
  ctx.fillStyle = '#ffffff';
  glyph('P', pi + 1, rh + 2);
}

// coffee shop: sign board, striped valance, big warm window
function bCafe(a, b, d) {
  const n = TN, rh = tf(0.18), wall = b < 0.5 ? '#2f5d4a' : '#7a3f2a';
  roof(rh, '#3a3330');
  if (d < 0.5) px(2, 1, 3, Math.max(1, rh - 2), '#8a8f94');
  px(0, rh, n, n - rh, wall);
  px(0, rh, n, 7, '#f3e6c8');
  sign('CAFE', 'CUP', rh + 1, wall);
  for (let i = 0; i < n; i += 2) px(i, rh + 7, Math.min(2, n - i), 1, (i >> 1) & 1 ? '#f3e6c8' : '#c94f3a');
  const wj = rh + 9;
  win(1, wj, n - 2, n - wj - 1, '#ffcf80');
  ctx.fillStyle = '#6b4a35';
  for (let i = 3; i < n - 3; i += 4) px(i, n - 3, 2, 1);
}

// bookshop: gold lettering, a window full of book spines
function bBooks(a, b, d) {
  const n = TN, rh = tf(0.18), wall = b < 0.5 ? '#2c3e66' : '#5b2e3e', s = Math.floor(d * 999);
  roof(rh, '#33303a');
  px(0, rh, n, n - rh, wall);
  sign('BOOK', 'LIT', rh + 1, '#ffd23f');
  const wj = rh + 8, ww = tf(0.62), inner = n - wj - 3;
  px(1, wj, ww, n - wj - 1, '#1d1b2e');
  const spines = ['#e8364f', '#ffd23f', '#4cc3e0', '#2bb673', '#fff3d6', '#ff6b2c'];
  for (let i = 2; i < ww; i++) {
    const h = Math.max(1, inner - Math.floor(hash(i, s, 7) * 2));
    px(i, n - 2 - h, 1, h, spines[(i + s) % 6]);
  }
  door(tf(0.7), wj - 1, Math.max(3, n - tf(0.7) - 1), shade(wall, -0.45));
}

// record store: dark sign board, records on display
function bRecords(a, b, d) {
  const n = TN, rh = tf(0.18), wall = b < 0.5 ? '#d9a441' : '#4f7f6a';
  roof(rh, '#3d3530');
  px(0, rh, n, n - rh, wall);
  px(0, rh, n, 7, '#1d1b2e');
  sign('LPS', 'LPS', rh + 1, '#ff6b2c');
  const wj = rh + 8, wh = n - wj - 1;
  win(1, wj, n - 2, wh, '#fff3d6');
  const cj = wj + Math.floor(wh / 2) - 1;
  for (let i = 3; i + 3 < n; i += 4) {
    px(i, cj + 1, 3, 1, '#141218');
    px(i + 1, cj, 1, 3, '#141218');
    px(i + 1, cj + 1, 1, 1, d < 0.5 ? '#e8364f' : '#4cc3e0');

}

const BUILDINGS = [bShop, bShop, bShop, bBrick, bBrick, bTheater, bDiner, bBar, bCivic, bDeck, bCafe, bBooks, bRecords];

function drawTree(cx, cy) {
  const o = 1 / RS;

  fr(cx - T * 0.22, cy - T * 0.1, T * 0.44, T * 0.36);

  circle(cx, cy - T * 0.08, T * 0.36 + o, '#173a22');
  circle(cx, cy - T * 0.08, T * 0.36, '#2f7d3a');
  circle(cx - T * 0.12, cy - T * 0.14, T * 0.22, '#3e9a47');

}

function drawLamp(cx, cy) {

}

function drawBench(cx, cy) {
  ellipse(cx + 2, cy + T * 0.16, T * 0.36, T * 0.08, 'rgba(0,0,0,0.2)');
  ctx.fillStyle = '#2b2b2b';
  fr(cx - T * 0.3, cy - T * 0.05, T * 0.05, T * 0.22);
